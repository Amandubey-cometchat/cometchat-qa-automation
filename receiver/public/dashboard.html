<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Webhook Event Inspector</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-border: #262b38;
    --text: #e6e8ef;
    --muted: #8b91a7;
    --accent: #6c8cff;
    --ok: #33c07a;
    --warn: #e2a33d;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 3px rgba(51,192,122,0.15);
  }
  .dot.off { background: #e05252; box-shadow: 0 0 0 3px rgba(224,82,82,0.15); }
  select, button, input[type="text"] {
    background: #1f2330;
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.danger:hover { border-color: #e05252; color: #ff8080; }
  .spacer { flex: 1; }
  .app-shell {
    display: flex;
    align-items: flex-start;
    max-width: 1180px;
    margin: 0 auto;
  }
  .sidebar {
    width: 200px;
    flex: none;
    padding: 20px 8px 20px 20px;
    position: sticky;
    top: 57px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    background: transparent;
    border: 1px solid transparent;
    text-align: left;
    width: 100%;
  }
  .sidebar-item:hover { background: #1a1d28; color: var(--text); }
  .sidebar-item.active {
    background: var(--panel);
    border-color: var(--panel-border);
    color: var(--text);
    font-weight: 600;
  }
  .sidebar-item .sidebar-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    background: rgba(108,140,255,0.12);
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-item.active .sidebar-count { color: var(--accent); }
  .sidebar-divider {
    height: 1px;
    background: var(--panel-border);
    margin: 8px 4px;
  }
  .main-content {
    flex: 1;
    min-width: 0;
  }
  main {
    padding: 20px;
  }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
  }
  .event {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .event.dup { border-color: var(--warn); }
  .dup-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(226,163,61,0.18);
    color: var(--warn);
    white-space: nowrap;
  }
  .event-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
  }
  .event-head:hover { background: rgba(108,140,255,0.06); }
  .badge {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 5px;
    background: rgba(108,140,255,0.15);
    color: var(--accent);
    white-space: nowrap;
  }
  .time {
    color: var(--muted);
    font-size: 12px;
    font-family: var(--mono);
  }
  .summary {
    color: var(--muted);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .chevron {
    color: var(--muted);
    font-size: 11px;
    transition: transform 0.15s;
  }
  .event.open .chevron { transform: rotate(90deg); }
  .event-body {
    display: none;
    border-top: 1px solid var(--panel-border);
  }
  .event.open .event-body { display: block; }
  pre {
    margin: 0;
    padding: 14px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    overflow-x: auto;
    color: #c9cee0;
  }
  .k { color: #7fb3ff; }
  .s { color: #9de08a; }
  .n { color: #e2a33d; }
  .b { color: #d693ff; }
  .copy-row {
    display: flex;
    justify-content: flex-end;
    padding: 8px 14px;
    border-top: 1px solid var(--panel-border);
  }
  .copy-row button { font-size: 11px; padding: 4px 8px; }
  .count {
    font-size: 12px;
    color: var(--muted);
  }
  .tabs {
    display: flex;
    gap: 4px;
  }
  .tab {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: #1f2330;
    border-color: var(--panel-border);
    color: var(--text);
  }
  .subheader {
    max-width: 980px;
    margin: 0 auto;
    padding: 14px 20px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 13px;
  }
  .stat.active { border-color: var(--accent); }
  .stat .dot2 { width: 8px; height: 8px; border-radius: 50%; }
  .stat .n { font-family: var(--mono); font-weight: 700; font-size: 14px; color: var(--text); }
  .stat .l { color: var(--muted); }
  .dot2.passed { background: var(--ok); }
  .dot2.failed { background: #e05252; }
  .dot2.skipped { background: #8b91a7; }
  .dot2.expected-fail { background: var(--warn); }
  .dot2.blocked { background: #7a5cff; }
  .run-meta { color: var(--muted); font-size: 12px; margin-left: auto; }
  .test-row { display: flex; align-items: center; gap: 10px; }
  .test-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 5px;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .test-badge.passed { background: rgba(51,192,122,0.15); color: var(--ok); }
  .test-badge.failed { background: rgba(224,82,82,0.15); color: #ff8080; }
  .test-badge.skipped { background: rgba(139,145,167,0.2); color: var(--muted); }
  .test-badge.expected-fail { background: rgba(226,163,61,0.18); color: var(--warn); }
  .test-badge.blocked { background: rgba(122,92,255,0.18); color: #a794ff; }
  .test-badge.not-received { background: rgba(108,140,255,0.15); color: var(--accent); cursor: help; }
  .test-file { color: var(--muted); font-size: 11px; font-family: var(--mono); white-space: nowrap; }
  .test-title { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reason-box {
    margin: 0;
    padding: 14px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-x: auto;
  }
  .reason-box.error { color: #ff9d9d; }
  .reason-box.skip { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>Webhook Dashboard</h1>
  <div class="tabs">
    <button class="tab active" id="tabEvents">Webhook Events</button>
    <button class="tab" id="tabResults">Test Results</button>
  </div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">connecting…</span></div>
  <div class="spacer"></div>
  <label id="autoRefreshLabel" style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);">
    <input type="checkbox" id="autoScroll" checked style="width:auto;" /> auto-refresh
  </label>
</header>

<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>

  <div class="main-content">
    <div class="subheader" id="eventsSubheader">
      <select id="triggerFilter"><option value="">All triggers</option></select>
      <span class="count" id="count"></span>
      <div class="spacer"></div>
      <button id="clearBtn" class="danger">Clear all</button>
    </div>

    <div class="subheader" id="resultsSubheader" style="display:none;">
      <div class="stat active" data-cat="" id="statAll"><span class="n" id="statAllN">0</span><span class="l">total</span></div>
      <div class="stat" data-cat="passed"><span class="dot2 passed"></span><span class="n" id="statPassedN">0</span><span class="l">passed</span></div>
      <div class="stat" data-cat="failed"><span class="dot2 failed"></span><span class="n" id="statFailedN">0</span><span class="l">failed</span></div>
      <div class="stat" data-cat="expected-fail"><span class="dot2 expected-fail"></span><span class="n" id="statExpFailN">0</span><span class="l">known issue</span></div>
      <div class="stat" data-cat="skipped"><span class="dot2 skipped"></span><span class="n" id="statSkippedN">0</span><span class="l">skipped</span></div>
      <div class="stat" data-cat="blocked"><span class="dot2 blocked"></span><span class="n" id="statBlockedN">0</span><span class="l">blocked</span></div>
      <span class="run-meta" id="runMeta"></span>
    </div>

    <main>
      <div id="list"></div>
      <div id="resultsList" style="display:none;"></div>
      <div class="empty" id="emptyState">No events yet. Trigger an action in CometChat and it'll show up here within a couple seconds.</div>
      <div class="empty" id="resultsEmptyState" style="display:none;">No test run found yet. Run <code>npx playwright test</code> and this will populate.</div>
    </main>
  </div>
</div>

<script>
  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('emptyState');
  const filterEl = document.getElementById('triggerFilter');
  const countEl = document.getElementById('count');
  const dotEl = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const autoScroll = document.getElementById('autoScroll');
  const clearBtn = document.getElementById('clearBtn');
  const sidebarEl = document.getElementById('sidebar');

  const openIds = new Set();
  let knownTriggers = new Set();
  let lastRenderKey = '';

  // Category grouping — trigger -> registry category comes from
  // /trigger-categories.json, generated from src/registry/webhook.registry.ts
  // (see scripts/generate-trigger-categories.ts) so this never has to be
  // kept in sync by hand. Sidebar labels/grouping match the CometChat
  // Dashboard's own webhook trigger tabs (Group / Call & Meeting / Message /
  // Campaign / User / Moderation) — note Call & Meeting merges this
  // project's two registry categories (CALLS, MEETINGS) into the one tab
  // CometChat itself shows, since that's a display-only grouping choice.
  const DISPLAY_CATEGORIES = [
    { key: 'GROUP', label: 'Group', registryCats: ['GROUP'] },
    { key: 'CALL_MEETING', label: 'Call & Meeting', registryCats: ['CALLS', 'MEETINGS'] },
    { key: 'MESSAGE', label: 'Message', registryCats: ['MESSAGE'] },
    { key: 'CAMPAIGN', label: 'Campaign', registryCats: ['CAMPAIGN'] },
    { key: 'USER', label: 'User', registryCats: ['USER'] },
    { key: 'MODERATION', label: 'Moderation', registryCats: ['MODERATION'] },
    { key: 'LEGACY', label: 'Legacy', registryCats: ['LEGACY'] },
  ];
  let triggerToCategory = {}; // trigger name -> registry category, for grouping LIVE events (collision-resolved, see generate-trigger-categories.ts)
  let categoryTotals = {}; // registry category -> how many webhooks are REGISTERED there, no collision resolution
  let selectedCategory = ''; // '' = All

  function displayCategoryOf(trigger) {
    const registryCat = triggerToCategory[trigger];
    const found = DISPLAY_CATEGORIES.find((c) => c.registryCats.includes(registryCat));
    return found ? found.key : 'OTHER';
  }

  // Total registered webhooks per display category, straight from the
  // registry's own per-category counts — deliberately NOT derived from
  // triggerToCategory, which collapses the 2 trigger names Legacy shares
  // with Message down to whichever one wins the collision. Legacy is
  // correctly 5 here even though only 3 of its names are ever uniquely
  // attributable in a live event.
  function totalsByDisplayCategory() {
    const totals = {};
    for (const c of DISPLAY_CATEGORIES) {
      totals[c.key] = c.registryCats.reduce((sum, rc) => sum + (categoryTotals[rc] || 0), 0);
    }
    return totals;
  }

  function renderSidebar(events) {
    // "Fired" = how many DISTINCT webhook types have shown up at least
    // once in history, not raw event volume — e.g. 40 message_sent events
    // still only count as 1 toward Message's fired total. That's what
    // makes "3/3" a meaningful coverage signal instead of just noise.
    const firedTriggersByCategory = {};
    const allFiredTriggers = new Set();
    for (const e of events) {
      if (!e.trigger) continue;
      allFiredTriggers.add(e.trigger);
      const key = displayCategoryOf(e.trigger);
      if (!firedTriggersByCategory[key]) firedTriggersByCategory[key] = new Set();
      firedTriggersByCategory[key].add(e.trigger);
    }
    const totals = totalsByDisplayCategory();
    const grandTotal = Object.values(categoryTotals).reduce((a, b) => a + b, 0);

    const items = [{ key: '', label: 'All', fired: allFiredTriggers.size, total: grandTotal }].concat(
      DISPLAY_CATEGORIES.map((c) => ({
        key: c.key,
        label: c.label,
        fired: (firedTriggersByCategory[c.key] || new Set()).size,
        total: totals[c.key] || 0,
      }))
    );
    if (firedTriggersByCategory.OTHER) {
      items.push({ key: 'OTHER', label: 'Other', fired: firedTriggersByCategory.OTHER.size, total: null });
    }

    sidebarEl.innerHTML = items
      .map(
        (it) => `
        <button class="sidebar-item ${selectedCategory === it.key ? 'active' : ''}" data-cat="${it.key}">
          <span>${escapeHtml(it.label)}</span>
          <span class="sidebar-count">${it.total == null ? it.fired : it.fired + '/' + it.total}</span>
        </button>`
      )
      .join('');
  }

  fetch('/trigger-categories.json')
    .then((r) => r.json())
    .then((data) => {
      triggerToCategory = data.triggerToCategory || {};
      categoryTotals = data.categoryTotals || {};
      lastRenderKey = '';
      poll(true);
    })
    .catch(() => {}); // categorization is a nice-to-have — events still render fine without it, just all under "Other"

  function fmtTime(ms) {
    const d = new Date(ms);
    return d.toLocaleTimeString(undefined, { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function highlightJsonString(json) {
    const escaped = escapeHtml(json);
    return escaped.replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(\.\d+)?([eE][+-]?\d+)?)/g,
      (match) => {
        let cls = 'n';
        if (/^"/.test(match)) {
          cls = /:$/.test(match) ? 'k' : 's';
        } else if (/true|false|null/.test(match)) {
          cls = 'b';
        }
        return `<span class="${cls}">${match}</span>`;
      }
    );
  }

  function highlightJson(obj) {
    return highlightJsonString(JSON.stringify(obj, null, 2));
  }

  /**
   * Failure/skip reasons are plain strings that often *contain* a raw JSON
   * error body pasted inline (e.g. CometChat REST errors:
   * 'POST /messages failed: 403 {"error":{...}}') rather than being pure
   * JSON themselves. Finds and syntax-highlights just the embedded JSON
   * part, pretty-printed, while leaving the surrounding message as plain
   * text — falls back to plain escaped text if there's no valid JSON to
   * find, so timeout-style messages (no JSON at all) still render fine.
   */
  function formatReason(text) {
    if (!text) return '';
    const jsonStart = text.indexOf('{');
    if (jsonStart === -1) return escapeHtml(text);

    const prefix = text.slice(0, jsonStart);
    const jsonPart = text.slice(jsonStart);
    try {
      const parsed = JSON.parse(jsonPart);
      const pretty = JSON.stringify(parsed, null, 2);
      return escapeHtml(prefix) + highlightJsonString(pretty);
    } catch {
      return escapeHtml(text);
    }
  }

  function summarize(payload) {
    try {
      const keys = Object.keys(payload.data || {});
      return keys.length ? keys.join(', ') : JSON.stringify(payload).slice(0, 80);
    } catch {
      return '';
    }
  }

  function eventId(e) {
    return e.receivedAt + ':' + (e.trigger || '');
  }

  // Duplicate-delivery detection: fingerprints an event by whatever
  // identifying field its payload shape actually carries (message id, group
  // guid, call id, ...) so two *different* real actions of the same trigger
  // type (extremely common — e.g. many message_sent events in one run)
  // don't get flagged, only genuine re-deliveries of the *same* underlying
  // event. user_connection_status_changed is excluded — it fires ambiently
  // and legitimately repeats for unrelated sessions, not a duplicate signal.
  function fingerprint(e) {
    if (e.trigger === 'user_connection_status_changed') return null;
    const d = e.payload && e.payload.data;
    if (!d) return null;
    if (d.message && d.message.id != null) return 'message:' + d.message.id;
    if (d.group && d.group.guid) return 'group:' + d.group.guid;
    if (d.call && d.call.id != null) return 'call:' + d.call.id;
    if (d.body && d.body.messageId != null) return 'receipt:' + d.body.messageId + ':' + d.body.action;
    if (d.reaction && d.reaction.messageId != null) {
      return 'reaction:' + d.reaction.messageId + ':' + d.reaction.reaction + ':' + (d.reaction.reactedBy && d.reaction.reactedBy.uid);
    }
    if (d.by && d.by.uid && d.users) return 'userstate:' + d.by.uid + ':' + Object.keys(d.users).sort().join(',');
    return null;
  }

  // Matches src/utils/timeout.ts's DUPLICATE_SETTLE_WINDOW_MS (4000) — the
  // same project-established threshold for "how long to watch for a
  // redelivery of the same webhook", plus a little headroom. A fingerprint
  // match on its own isn't enough to call something a duplicate delivery:
  // some triggers (user_blocked/unblocked, connection status) only carry
  // identifying fields drawn from this project's small set of fixed test
  // users, so the SAME fingerprint recurs across every unrelated test run
  // in history, sometimes hours apart. A real duplicate delivery — the
  // thing worth flagging — lands close together in time; two coincidentally
  // matching events from separate runs don't.
  const DUPLICATE_WINDOW_MS = 5000;

  function computeDuplicates(events) {
    const groups = new Map();
    for (const e of events) {
      const fp = fingerprint(e);
      if (fp == null) continue;
      const key = (e.trigger || '') + '|' + fp;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(e);
    }
    const dupInfo = new Map(); // eventId -> { index, count, deltaMs }
    for (const list of groups.values()) {
      if (list.length < 2) continue;
      list.sort((a, b) => a.receivedAt - b.receivedAt);
      // Cluster into bursts that landed within the window of each other —
      // only a burst counts as a plausible duplicate delivery, not the
      // whole historical group sharing a fingerprint.
      let clusterStart = 0;
      for (let i = 1; i <= list.length; i++) {
        const endOfCluster = i === list.length || list[i].receivedAt - list[i - 1].receivedAt > DUPLICATE_WINDOW_MS;
        if (endOfCluster) {
          const cluster = list.slice(clusterStart, i);
          if (cluster.length > 1) {
            cluster.forEach((e, idx) => {
              dupInfo.set(eventId(e), { index: idx + 1, count: cluster.length, deltaMs: e.receivedAt - cluster[0].receivedAt });
            });
          }
          clusterStart = i;
        }
      }
    }
    return dupInfo;
  }

  function renderEventCard(e, dupInfo) {
    const id = eventId(e);
    const open = openIds.has(id);
    const dup = dupInfo.get(id);
    const dupBadge = dup
      ? `<span class="dup-badge" title="Same ${escapeHtml(e.trigger)} event delivered ${dup.count} times (this is delivery ${dup.index}, ${dup.deltaMs}ms after the first) — possible duplicate delivery">⚠ ${dup.index}/${dup.count} duplicate</span>`
      : '';
    return `
    <div class="event ${open ? 'open' : ''} ${dup ? 'dup' : ''}" data-id="${id}">
      <div class="event-head" onclick="window.__toggle('${id}')">
        <span class="chevron">▶</span>
        <span class="badge">${escapeHtml(e.trigger || 'unknown')}</span>
        <span class="time">${fmtTime(e.receivedAt)}</span>
        ${dupBadge}
        <span class="summary">${escapeHtml(summarize(e.payload))}</span>
      </div>
      <div class="event-body">
        <pre>${highlightJson(e.payload)}</pre>
        <div class="copy-row">
          <button onclick='window.__copy(${JSON.stringify(JSON.stringify(e.payload))})'>Copy JSON</button>
        </div>
      </div>
    </div>`;
  }

  function render(events) {
    renderSidebar(events);

    const catFiltered = selectedCategory ? events.filter((e) => displayCategoryOf(e.trigger) === selectedCategory) : events;
    const filter = filterEl.value;
    const filtered = filter ? catFiltered.filter((e) => e.trigger === filter) : catFiltered;

    countEl.textContent = filtered.length + (filter || selectedCategory ? ` of ${events.length}` : '') + ' event' + (events.length === 1 ? '' : 's');
    // Gated on activeTab, not just "is there data" — render() can run while
    // the Results tab is showing (e.g. Clear all polls both stores
    // together), and this element must stay hidden unless Events is
    // actually the visible tab, or both empty-states can show at once.
    emptyEl.style.display = activeTab === 'events' && !filtered.length ? 'block' : 'none';

    const dupInfo = computeDuplicates(events); // computed over the FULL set — a duplicate delivery is real regardless of which filter is currently applied

    const renderKey =
      filtered.map(eventId).join('|') + '|' + [...openIds].join(',') + '|' + selectedCategory + '|' + [...dupInfo.keys()].join(',');
    if (renderKey === lastRenderKey) return;
    lastRenderKey = renderKey;

    listEl.innerHTML = filtered
      .slice()
      .reverse()
      .map((e) => renderEventCard(e, dupInfo))
      .join('');
  }

  // Pure client-side interactions (expand a card, pick a category, change
  // the trigger filter) re-render instantly from whatever's already
  // loaded — they never need to wait on a network round-trip just to
  // reflect a UI-only state change. The 1.5s background poll() keeps
  // lastEventsData fresh regardless of which of these was last touched.
  function rerender() {
    lastRenderKey = '';
    render(lastEventsData);
  }

  window.__toggle = (id) => {
    if (openIds.has(id)) openIds.delete(id);
    else openIds.add(id);
    rerender();
  };

  sidebarEl.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.sidebar-item');
    if (!btn) return;
    selectedCategory = btn.dataset.cat;
    if (activeTab !== 'events') setTab('events');
    rerender();
  });

  window.__copy = (json) => {
    navigator.clipboard.writeText(json).catch(() => {});
  };

  function updateFilterOptions(events) {
    const triggers = new Set(events.map((e) => e.trigger).filter(Boolean));
    let changed = triggers.size !== knownTriggers.size;
    if (!changed) {
      for (const t of triggers) if (!knownTriggers.has(t)) { changed = true; break; }
    }
    if (!changed) return;
    knownTriggers = triggers;
    const current = filterEl.value;
    const options = ['<option value="">All triggers</option>']
      .concat([...triggers].sort().map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`));
    filterEl.innerHTML = options.join('');
    filterEl.value = current;
  }

  let lastEventsData = [];

  async function poll(force) {
    try {
      const res = await fetch('/webhook/history');
      const json = await res.json();
      dotEl.classList.remove('off');
      statusText.textContent = 'connected';
      lastEventsData = json.events;
      updateFilterOptions(json.events);
      render(json.events);
    } catch (err) {
      dotEl.classList.add('off');
      statusText.textContent = 'disconnected';
    }
  }

  filterEl.addEventListener('change', rerender);

  clearBtn.addEventListener('click', async () => {
    if (!confirm('Clear all stored events and the last test results?')) return;
    await Promise.all([fetch('/webhook/history', { method: 'DELETE' }), fetch('/test-results', { method: 'DELETE' })]);
    openIds.clear();
    openResultIds.clear();
    lastRenderKey = '';
    lastResultsRenderKey = '';
    poll(true);
    pollResults(true);
  });

  poll();
  setInterval(() => { if (autoScroll.checked) poll(); }, 1500);

  // ---- Test Results tab ----

  const tabEvents = document.getElementById('tabEvents');
  const tabResults = document.getElementById('tabResults');
  const eventsSubheader = document.getElementById('eventsSubheader');
  const resultsSubheader = document.getElementById('resultsSubheader');
  const resultsListEl = document.getElementById('resultsList');
  const resultsEmptyEl = document.getElementById('resultsEmptyState');
  const runMetaEl = document.getElementById('runMeta');

  const openResultIds = new Set();
  let resultsCategoryFilter = '';
  let lastResultsRenderKey = '';
  let activeTab = 'events';

  function setTab(tab) {
    activeTab = tab;
    const onEvents = tab === 'events';
    tabEvents.classList.toggle('active', onEvents);
    tabResults.classList.toggle('active', !onEvents);
    eventsSubheader.style.display = onEvents ? 'flex' : 'none';
    resultsSubheader.style.display = onEvents ? 'none' : 'flex';
    listEl.style.display = onEvents ? '' : 'none';
    resultsListEl.style.display = onEvents ? 'none' : '';
    emptyEl.style.display = onEvents && !listEl.children.length ? 'block' : 'none';
    resultsEmptyEl.style.display = !onEvents && !resultsListEl.children.length ? 'block' : 'none';
    if (!onEvents) pollResults(true);
  }
  tabEvents.addEventListener('click', () => setTab('events'));
  tabResults.addEventListener('click', () => setTab('results'));

  document.querySelectorAll('.stat').forEach((el) => {
    el.addEventListener('click', () => {
      resultsCategoryFilter = el.dataset.cat || '';
      document.querySelectorAll('.stat').forEach((s) => s.classList.toggle('active', s === el));
      lastResultsRenderKey = '';
      renderResults(window.__lastResultsData || { tests: [], counts: {} });
    });
  });

  function fmtDuration(ms) {
    if (ms == null) return '';
    return ms < 1000 ? ms + 'ms' : (ms / 1000).toFixed(1) + 's';
  }

  function testRowId(t, i) {
    return t.file + ':' + t.title + ':' + i;
  }

  function categoryLabel(cat) {
    return { passed: 'passed', failed: 'failed', skipped: 'skipped', 'expected-fail': 'known issue', blocked: 'blocked' }[cat] || cat;
  }

  function renderResults(data) {
    window.__lastResultsData = data;
    const counts = data.counts || {};
    document.getElementById('statAllN').textContent = data.tests.length;
    document.getElementById('statPassedN').textContent = counts.passed || 0;
    document.getElementById('statFailedN').textContent = counts.failed || 0;
    document.getElementById('statExpFailN').textContent = counts['expected-fail'] || 0;
    document.getElementById('statSkippedN').textContent = counts.skipped || 0;
    document.getElementById('statBlockedN').textContent = counts.blocked || 0;

    if (data.duration != null) {
      runMetaEl.textContent = 'last run: ' + (data.duration / 1000).toFixed(1) + 's'
        + (data.startTime ? ' · ' + new Date(data.startTime).toLocaleTimeString() : '');
    }

    const filtered = resultsCategoryFilter ? data.tests.filter((t) => t.category === resultsCategoryFilter) : data.tests;

    // Same activeTab gating as render()'s emptyEl above — renderResults()
    // can run while the Events tab is showing (Clear all polls both stores
    // together), and this must stay hidden unless Results is the visible tab.
    const resultsEmptyNeeded = data.available === false || !filtered.length;
    resultsEmptyEl.style.display = activeTab === 'results' && resultsEmptyNeeded ? 'block' : 'none';
    if (data.available === false) {
      resultsEmptyEl.textContent = 'No test run found yet. Run npx playwright test and this will populate.';
    } else if (!filtered.length) {
      resultsEmptyEl.textContent = 'No tests in this category.';
    }

    const renderKey = filtered.map((t, i) => testRowId(t, i) + t.category).join('|') + '|' + [...openResultIds].join(',');
    if (renderKey === lastResultsRenderKey) return;
    lastResultsRenderKey = renderKey;

    // Order: failed first (most actionable), then expected-fail, then
    // ordinary skips, then blocked (permanent, known, least actionable),
    // then passed.
    const order = { failed: 0, 'expected-fail': 1, skipped: 2, blocked: 3, passed: 4 };
    const sorted = filtered.slice().sort((a, b) => (order[a.category] ?? 9) - (order[b.category] ?? 9));

    resultsListEl.innerHTML = sorted
      .map((t, i) => {
        const id = testRowId(t, i);
        const open = openResultIds.has(id);
        const reason = t.error || t.skipReason || t.knownIssueReason;
        const reasonClass = t.error ? 'error' : 'skip';
        const canExpand = Boolean(reason);
        // Not a certain diagnosis (no Management API access to check the
        // actual Dashboard trigger state) — just distinguishes "nothing
        // arrived at all" from "something arrived but was wrong", since
        // those currently look identical under one FAILED badge.
        const notReceivedBadge = t.likelyNotReceived
          ? '<span class="test-badge not-received" title="No webhook arrived at all before the timeout — could be a disabled trigger in the Dashboard, or a real regression. Not certain either way without Management API access.">not received?</span>'
          : '';
        return `
        <div class="event ${open ? 'open' : ''}" data-id="${id}">
          <div class="event-head" ${canExpand ? `onclick="window.__toggleResult('${id}')"` : 'style="cursor:default;"'}>
            ${canExpand ? '<span class="chevron">▶</span>' : '<span class="chevron" style="visibility:hidden;">▶</span>'}
            <div class="test-row" style="flex:1; min-width:0;">
              <span class="test-badge ${t.category}">${categoryLabel(t.category)}</span>
              ${notReceivedBadge}
              <span class="test-file">${escapeHtml(t.file)}</span>
              <span class="test-title">${escapeHtml(t.title)}</span>
            </div>
            <span class="time">${fmtDuration(t.duration)}</span>
          </div>
          ${canExpand ? `<div class="event-body">
            <pre class="reason-box ${reasonClass}">${formatReason(reason)}</pre>
            <div class="copy-row">
              <button onclick='window.__copy(${JSON.stringify(reason)})'>Copy</button>
            </div>
          </div>` : ''}
        </div>`;
      })
      .join('');
  }

  window.__toggleResult = (id) => {
    if (openResultIds.has(id)) openResultIds.delete(id);
    else openResultIds.add(id);
    lastResultsRenderKey = '';
    renderResults(window.__lastResultsData || { tests: [], counts: {} });
  };

  async function pollResults() {
    try {
      const res = await fetch('/test-results');
      const json = await res.json();
      dotEl.classList.remove('off');
      statusText.textContent = 'connected';
      renderResults(json);
    } catch (err) {
      dotEl.classList.add('off');
      statusText.textContent = 'disconnected';
    }
  }

  setInterval(() => { if (autoScroll.checked && activeTab === 'results') pollResults(); }, 1500);
</script>

</body>
</html>
