# One-click deploy: https://render.com/deploy?repo=https://github.com/Amandubey-cometchat/cometchat-webhook-automation
#
# Provisions a dedicated instance of cometchat-automation/webhook-automation/receiver/
# (the webhook project's receiver) as its own Render Web Service — see
# cometchat-automation/webhook-automation/README.md "Step 1 — Deploy the receiver". Lives at the
# repo root because that's the only place Render looks for a Blueprint. This is the fast path for that step: click the button, get a
# real, working, isolated URL in about a minute, no manual Render project
# setup. BASIC_AUTH_PASS is auto-generated by Render rather than shipped
# with a default — after deploying, copy BASIC_AUTH_USER and the generated
# BASIC_AUTH_PASS from this service's "Environment" tab into the setup
# wizard (or your .env.<name> file) as WEBHOOK_BASIC_AUTH_USER/_PASS.
#
# Each environment (staging, prod-eu, prod-us, prod-in) needs its OWN,
# separate receiver instance — never point two environments at the same
# one (see README "Multiple environments" for why). Click the deploy
# button again — it creates a new, independent service each time — once
# per environment you actually use.
#
# Free plan: spins down after inactivity and takes a moment to wake back
# up on the next request — expected, not a bug (see README
# "Troubleshooting"). Upgrade the plan below if that's a problem for your use.
services:
  - type: web
    name: cometchat-webhook-receiver
    runtime: node
    rootDir: cometchat-automation/webhook-automation/receiver
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BASIC_AUTH_USER
        value: qa
      - key: BASIC_AUTH_PASS
        generateValue: true
