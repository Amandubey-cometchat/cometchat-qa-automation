<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Webhook Dashboard</title>
<style>
  /*
   * Color roles. Category hues are the dataviz reference palette's dark
   * steps in fixed order, validated against THIS page's panel surface
   * (#171a23) with scripts/validate_palette.js: all checks pass, worst
   * adjacent CVD ΔE 8.4. Status tokens below are reserved for state only
   * and always ship with a text label, never color alone.
   */
  :root {
    color-scheme: dark;
    --page: #0f1117;
    --surface: #171a23;
    --surface-2: #1d2130;
    --inset: #12141c;
    --hairline: #262b38;
    --ink: #e6e8ef;
    --ink-2: #b3b8c8;
    --muted: #8b91a7;
    --accent: #6c8cff;

    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --neutral: #6b7086;

    --cat-group: #3987e5;
    --cat-call: #d95926;
    --cat-message: #199e70;
    --cat-campaign: #c98500;
    --cat-user: #d55181;
    --cat-moderation: #008300;
    --cat-legacy: #9085e9;
    --cat-notification: #e66767;
    --cat-other: #6b7086;

    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --header-h: 55px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
  }
  button, select, input { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  [hidden] { display: none !important; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(15,17,23,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--hairline);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    background: linear-gradient(135deg, #3987e5, #9085e9);
    display: grid; place-items: center;
  }
  .brand-mark svg { width: 15px; height: 15px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; letter-spacing: -0.01em; }
  .env-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    padding: 3px 9px; border-radius: 20px;
    border: 1px solid var(--hairline); background: var(--surface); color: var(--ink-2);
    white-space: nowrap;
  }
  .env-pill .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--neutral); }
  .env-pill.prod .pip { background: var(--warning); }
  .tabs { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 9px; padding: 3px; }
  .tab {
    background: transparent; border: 0; color: var(--muted);
    padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--ink); }
  .tab-live, .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; animation: live-pulse 1.4s ease-out infinite; }
  @keyframes live-pulse { 0% { box-shadow: 0 0 0 0 rgba(108,140,255,0.65); } 80%, 100% { box-shadow: 0 0 0 7px rgba(108,140,255,0); } }
  .tab.active { background: var(--surface-2); color: var(--ink); box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset; }
  .spacer { flex: 1; }
  .conn { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: pulse 2s ease-in-out infinite; }
  .conn .dot.off { background: var(--critical); animation: none; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px rgba(12,163,12,0.18); } 50% { box-shadow: 0 0 0 6px rgba(12,163,12,0.06); } }

  /* ---------- shared controls ---------- */
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .search { position: relative; flex: 1 1 260px; min-width: 0; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--muted); pointer-events: none; }
  .search kbd {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    border: 1px solid var(--hairline); border-radius: 4px; padding: 0 5px; pointer-events: none;
  }
  .control {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--hairline); border-radius: 8px;
    padding: 7px 10px; font-size: 13px; min-width: 0;
  }
  .control:hover { border-color: #353b4d; }
  .search .control { width: 100%; padding-left: 31px; padding-right: 32px; }
  select.control { max-width: 300px; }
  .chip-toggle {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 6px 10px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap;
  }
  .chip-toggle input { accent-color: var(--accent); margin: 0; }
  .chip-toggle .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface); color: var(--ink-2);
    border: 1px solid var(--hairline); border-radius: 8px;
    padding: 7px 12px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { color: var(--ink); border-color: #353b4d; }
  .btn svg { width: 13px; height: 13px; flex: none; }
  .btn.danger:hover { color: #ff9a9a; border-color: rgba(208,59,59,0.6); }
  .btn.small { padding: 4px 9px; font-size: 11.5px; }
  .btn.on { color: var(--ink); border-color: rgba(250,178,25,0.55); background: rgba(250,178,25,0.08); }
  .btn .n { color: var(--warning); font-variant-numeric: tabular-nums; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  .swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; display: inline-block; }
  .flag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
    background: rgba(255,255,255,0.05); color: var(--ink); white-space: nowrap; flex: none;
  }
  code { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .k { color: #7fb3ff; } .s { color: #9de08a; } .n { color: #e2b86b; } .b { color: #d693ff; }
  .who { color: var(--ink); }
  .quote { color: var(--muted); }

  /* ---------- shared tooltip ---------- */
  .tip {
    position: fixed; z-index: 50; pointer-events: none;
    background: #232839; border: 1px solid #343a4f; border-radius: 8px;
    padding: 7px 10px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    display: none; white-space: nowrap;
  }
  .tip .v { font-weight: 600; color: var(--ink); }
  .tip .l { color: var(--muted); margin-top: 2px; }

  /* =====================================================================
     Live events — a request inspector: timeline on top, the requests on
     the left, the selected one's full request on the right. On desktop
     the two panes scroll on their own and the page itself never does.
     ===================================================================== */
  body.on-events { overflow: hidden; }
  .events {
    height: calc(100vh - var(--header-h));
    height: calc(100dvh - var(--header-h));
    display: flex; flex-direction: column; gap: 12px;
    padding: 16px 24px; max-width: 1480px; margin: 0 auto;
  }

  .scope { flex: none; background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 12px 16px; }
  .scope-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .method {
    font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--ink); border: 1px solid var(--hairline); border-radius: 5px; padding: 2px 6px; flex: none;
  }
  .endpoint { font-size: 13px; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .endpoint .path { color: var(--muted); }
  .icon-btn {
    display: inline-grid; place-items: center; width: 26px; height: 26px; flex: none;
    background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--muted); cursor: pointer;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--hairline); }
  .icon-btn svg { width: 14px; height: 14px; }
  .seg { display: inline-flex; gap: 2px; background: var(--inset); border: 1px solid var(--hairline); border-radius: 7px; padding: 2px; }
  .seg button {
    background: transparent; border: 0; color: var(--muted); cursor: pointer;
    font-size: 12px; padding: 3px 9px; border-radius: 5px; font-variant-numeric: tabular-nums;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
  .live-state { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); white-space: nowrap; min-width: 58px; }
  .live-state .pause-mark { width: 8px; height: 9px; border-left: 3px solid var(--warning); border-right: 3px solid var(--warning); flex: none; }

  .timeline {
    display: flex; align-items: flex-end; gap: 2px;
    height: 56px; margin-top: 14px;
    border-bottom: 1px solid var(--hairline);
  }
  .tcol { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: pointer; }
  .tbar { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; height: 0; transition: height 0.25s ease; }
  .tcol.zero { cursor: default; }
  .tcol:not(.zero):hover .tbar { filter: brightness(1.3); }
  .tcol.has-sel .tbar { background: #a9bbff; }
  .axis { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .metrics {
    display: flex; flex-wrap: wrap; gap: 6px 22px;
    margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--hairline);
    font-size: 12.5px; color: var(--ink-2);
  }
  .metric { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .metric b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  .panes {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr);
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; overflow: hidden;
  }
  .list-pane { position: relative; overflow-y: auto; border-right: 1px solid var(--hairline); overscroll-behavior: contain; }
  .list-pane:focus-visible { outline-offset: -2px; }
  .detail-pane { overflow: auto; background: var(--inset); overscroll-behavior: contain; }

  .row {
    position: relative; display: flex; flex-direction: column; gap: 3px;
    width: 100%; padding: 10px 14px 10px 17px; text-align: left;
    background: transparent; border: 0; border-bottom: 1px solid var(--hairline);
    color: inherit; font: inherit; cursor: pointer;
  }
  .row:hover { background: rgba(255,255,255,0.025); }
  .row.sel { background: var(--surface-2); }
  .row.sel::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
  .row:focus-visible { outline-offset: -2px; }
  .row--new { animation: flash-new 1.8s ease-out; }
  @keyframes flash-new { 0% { background: rgba(108,140,255,0.16); } 100% { background: transparent; } }
  .row-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .row-trigger { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-time { margin-left: auto; flex: none; font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row-sum { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .flag { padding: 1px 7px; font-size: 10.5px; }
  .list-note { padding: 14px; font-size: 12px; color: var(--muted); text-align: center; }

  .detail { padding: 18px 22px 28px; display: flex; flex-direction: column; gap: 20px; }
  .back { display: none; align-self: flex-start; }
  .detail-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .detail-trigger { font-family: var(--mono); font-size: 16px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
  .cat-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .detail-summary { margin: -10px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 28px; margin: 0; font-size: 13px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; color: var(--ink); font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .facts dd .quote { font-family: var(--sans); font-size: 12.5px; }
  .sec-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--hairline);
  }
  .sec-title .n { font-weight: 500; letter-spacing: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sec-title .btn { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .htable { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; }
  .htable th { text-align: left; font-weight: 400; color: var(--muted); padding: 5px 28px 5px 0; white-space: nowrap; vertical-align: top; width: 1%; }
  .htable td { color: var(--ink); padding: 5px 0; overflow-wrap: anywhere; word-break: break-word; }
  .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .body-pre {
    margin: 8px 0 0; padding: 14px 16px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--hairline);
    font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: #c9cee0;
    overflow-x: auto; tab-size: 2;
  }
  .pane-empty { color: var(--muted); text-align: center; padding: 56px 24px; font-size: 13.5px; line-height: 1.6; }
  .pane-empty b { color: var(--ink-2); font-weight: 500; }

  /* =====================================================================
     Test results
     ===================================================================== */
  .app-shell { display: flex; align-items: flex-start; max-width: 1280px; margin: 0 auto; }
  .sidebar {
    width: 232px; flex: none;
    padding: 22px 8px 22px 24px;
    position: sticky; top: var(--header-h);
    display: flex; flex-direction: column; gap: 2px;
  }
  .side-title { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 10px 8px; }
  .side-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 0 10px 10px; font-size: 11px; color: var(--muted); }
  .side-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .side-item {
    display: flex; flex-direction: column; gap: 7px;
    padding: 9px 10px; border-radius: 8px;
    font-size: 13px; color: var(--ink-2);
    cursor: pointer; background: transparent; border: 1px solid transparent;
    text-align: left; width: 100%;
  }
  .side-item:hover { background: var(--surface); color: var(--ink); }
  .side-item.active { background: var(--surface); border-color: var(--hairline); color: var(--ink); }
  .side-row { display: flex; align-items: center; gap: 8px; width: 100%; }
  .side-row .name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-row .num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stack { display: flex; gap: 2px; height: 5px; }
  .stack .seg { height: 100%; min-width: 3px; border-radius: 1px; }
  .stack .seg:first-child { border-top-left-radius: 3px; border-bottom-left-radius: 3px; }
  .stack .seg:last-child { border-top-right-radius: 3px; border-bottom-right-radius: 3px; }
  .stack .empty-track { flex: 1; background: var(--hairline); border-radius: 3px; }
  .main-content { flex: 1; min-width: 0; padding: 22px 24px 40px 16px; }

  .live {
    background: var(--surface); border: 1px solid rgba(108,140,255,0.45); border-radius: 14px;
    padding: 14px 18px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .live.stale { border-color: rgba(250,178,25,0.5); }
  .live-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
  .live-badge {
    display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink);
    background: rgba(108,140,255,0.14); padding: 3px 9px; border-radius: 20px;
  }
  .live.stale .live-badge { background: rgba(250,178,25,0.14); }
  .live.stale .live-dot { background: var(--warning); animation: none; }
  .live-head b { color: var(--ink); font-weight: 600; }
  .live-elapsed { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* Track is a lighter step of the fill's own hue, so progress reads across the whole bar. */
  .live-meter { height: 6px; border-radius: 3px; background: rgba(108,140,255,0.16); overflow: hidden; }
  .live-meter .fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.5s ease; }
  .live-current { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live-current b { color: var(--ink-2); font-weight: 500; }

  .hero {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 28px; align-items: center;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px;
    padding: 20px 24px; margin-bottom: 16px;
  }
  .hero-figure { font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
  .hero-body { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .hero-caption { font-size: 14px; color: var(--ink-2); }
  .hero-caption b { color: var(--ink); font-weight: 600; }
  .hero-meter { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .hero-meter .fill { height: 100%; border-radius: 4px; transition: width 0.6s ease, background 0.3s ease; }
  .hero-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }

  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 7px 12px; cursor: pointer; font-size: 13px; color: var(--ink-2);
  }
  .stat:hover { border-color: #353b4d; color: var(--ink); }
  .stat.active { border-color: var(--accent); color: var(--ink); background: rgba(108,140,255,0.06); }
  .stat .n { font-weight: 600; color: var(--ink); }

  .card {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px;
    margin-bottom: 8px; overflow: hidden;
  }
  .card--new { animation: flash-card 1.8s ease-out; }
  @keyframes flash-card { 0% { background: rgba(108,140,255,0.16); } 100% { background: var(--surface); } }
  .card-head {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 11px 14px; background: transparent; border: 0; color: inherit;
    font: inherit; text-align: left; cursor: pointer;
  }
  .card-head:hover { background: rgba(255,255,255,0.025); }
  .card-head.static { cursor: default; }
  .card-head.static:hover { background: transparent; }
  .cat-bar { width: 3px; align-self: stretch; border-radius: 2px; flex: none; margin: -3px 0; }
  .chev { color: var(--muted); font-size: 10px; flex: none; transition: transform 0.15s; width: 10px; }
  .card.open .chev { transform: rotate(90deg); }
  .when { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; flex: none; }
  .card-body { display: none; border-top: 1px solid var(--hairline); }
  .card.open .card-body { display: block; }
  pre {
    margin: 0; padding: 14px; font-family: var(--mono); font-size: 12px; line-height: 1.55;
    overflow-x: auto; color: #c9cee0;
  }
  .card-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--hairline); }
  .test-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .test-file { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .test-title { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reason { white-space: pre-wrap; line-height: 1.6; }
  .reason.error { color: #ffb0b0; }
  .reason.skip { color: var(--muted); }
  .hint {
    margin: 14px 14px 0; padding: 10px 12px; border-radius: 8px;
    background: rgba(108,140,255,0.08); border: 1px solid rgba(108,140,255,0.28);
    color: var(--ink-2); font-size: 12.5px; line-height: 1.5;
  }
  .hint b { color: var(--ink); }
  .empty {
    color: var(--muted); text-align: center; padding: 56px 20px; font-size: 14px;
    border: 1px dashed var(--hairline); border-radius: 12px;
  }
  .empty b { color: var(--ink-2); font-weight: 500; }

  @media (prefers-reduced-motion: reduce) {
    .tab-live, .live-dot, .conn .dot { animation: none; }
    .row--new, .card--new { animation: none; }
    .tbar { transition: none; }
  }

  /* ---------- narrow screens ---------- */
  @media (max-width: 980px) {
    .panes { grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); }
  }
  @media (max-width: 760px) {
    header { padding: 10px 16px; gap: 10px; }
    .tabs { order: 3; }
    /* One pane at a time, and the page scrolls normally. */
    body.on-events { overflow: auto; }
    .events { height: auto; padding: 12px 16px 24px; }
    .search { flex-basis: 100%; }
    .search kbd { display: none; }
    select.control { flex: 1 1 auto; max-width: none; }
    .panes { display: block; }
    .list-pane { border-right: 0; }
    .detail-pane { display: none; }
    .panes.show-detail .list-pane { display: none; }
    .panes.show-detail .detail-pane { display: block; }
    .back { display: inline-flex; }
    .detail { padding: 14px 16px 22px; }
    .facts { grid-template-columns: 1fr; gap: 2px; }
    .facts dd { margin-bottom: 8px; }
    .metrics { gap: 6px 16px; }
    .metric { white-space: normal; }

    .app-shell { flex-direction: column; }
    .sidebar {
      position: static; width: 100%;
      flex-direction: row; overflow-x: auto; gap: 6px;
      padding: 14px 16px 4px;
      scrollbar-width: none;
    }
    .sidebar::-webkit-scrollbar { display: none; }
    .side-title, .side-legend { display: none; }
    .side-item { flex: none; width: auto; min-width: 128px; background: var(--surface); border-color: var(--hairline); }
    .main-content { padding: 14px 16px 32px; }
    .hero { grid-template-columns: 1fr; padding: 16px 18px; }
    .hero-figure { font-size: 48px; }
    .card-head { flex-wrap: wrap; row-gap: 6px; }
    .when { margin-left: auto; }
    .test-main { flex-wrap: wrap; }
    .test-title { flex-basis: 100%; white-space: normal; }
  }
</style>
</head>
<body class="on-events">

<header id="appHeader">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h3l2-5 2 10 2-5h3"/></svg>
    </div>
    <h1>Webhook Dashboard</h1>
    <span class="env-pill" id="envPill"><span class="pip"></span><span id="envLabel"></span></span>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab active" id="tabEvents" role="tab" aria-selected="true">Live events</button>
    <button class="tab" id="tabResults" role="tab" aria-selected="false">Test results<span class="tab-live" id="tabLive" hidden title="A test run is in progress"></span></button>
  </div>
  <div class="spacer"></div>
  <div class="conn"><span class="dot" id="statusDot"></span><span id="statusText">connecting…</span></div>
</header>

<!-- ===== Live events ===== -->
<section class="events" id="eventsView">
  <div class="scope">
    <div class="scope-head">

      <code class="endpoint" id="endpoint" title="The URL CometChat's Dashboard should deliver webhooks to"></code>
      <button class="icon-btn" id="copyEndpoint" title="Copy webhook URL" aria-label="Copy webhook URL">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V3.5A1.5 1.5 0 0 0 9 2H3.5A1.5 1.5 0 0 0 2 3.5V9A1.5 1.5 0 0 0 3.5 10.5h2"/></svg>
      </button>
      <div class="spacer"></div>
      <div class="seg" role="group" aria-label="Timeline window" id="windowSeg">

        <button type="button" data-window="15m">15m</button>
        <button type="button" data-window="1h">1h</button>

  <div class="toolbar">

    </div>

    <label class="chip-toggle" title="user_connection_status_changed fires for every client connect/disconnect and usually dominates the feed">
      <input type="checkbox" id="hidePresence" checked /> Hide presence <span class="n" id="presenceCount"></span>
    </label>
    <button class="btn" id="pauseBtn" type="button" aria-pressed="false"></button>

  <div class="panes" id="panes">

    <div class="detail-pane" id="detailPane" aria-live="off"></div>

<!-- ===== Test results ===== -->

  <nav class="sidebar" id="sidebar" aria-label="Test categories"></nav>
  <div class="main-content">
