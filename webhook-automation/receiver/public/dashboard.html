<div class="tip" id="tip" role="tooltip"><div class="v"></div><div class="l"></div></div>

<script>
  const $ = (id) => document.getElementById(id);
  const listEl = $('list');
  const detailEl = $('detailPane');
  const panesEl = $('panes');
  const filterEl = $('viewFilter');
  const searchEl = $('searchBox');
  const hidePresenceEl = $('hidePresence');
  const pauseBtn = $('pauseBtn');
  const timelineEl = $('timeline');
  const dotEl = $('statusDot');
  const statusText = $('statusText');
  const sidebarEl = $('sidebar');
  const tipEl = $('tip');

  const PRESENCE_TRIGGERS = ['user_connection_status_changed'];
  const narrow = window.matchMedia('(max-width: 760px)');

  // The events view fills the viewport under the header, whose height
  // changes when it wraps on narrower screens.
  new ResizeObserver(([entry]) => {
    document.documentElement.style.setProperty('--header-h', Math.ceil(entry.target.getBoundingClientRect().height) + 'px');
  }).observe($('appHeader'));

  // ---- per-viewer conveniences (never required: storage can be blocked) ----
  function loadPref(key, fallback) {
    try { const v = localStorage.getItem('whd:' + key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; }
  }
  function savePref(key, value) {
    try { localStorage.setItem('whd:' + key, JSON.stringify(value)); } catch { /* storage unavailable */ }
  }
  hidePresenceEl.checked = loadPref('hidePresence', true);

  // ---- environment label ----
  // Each environment has its own dedicated receiver, so the hostname says
  // which one this is. The prod-eu receiver predates the per-region naming
  // (see .env.prod-eu), hence its explicit entry.
  function deriveEnv(host) {
    const h = host.toLowerCase();
    const m = h.match(/prod[-_]?(us|eu|in)/);
    if (m) return { label: 'PROD-' + m[1].toUpperCase(), prod: true };
    if (h.includes('staging')) return { label: 'STAGING-US', prod: false };
    if (h === 'cometchat-webhook-automation.onrender.com') return { label: 'PROD-EU', prod: true };
    if (h === 'localhost' || h.startsWith('127.')) return { label: 'LOCAL', prod: false };
    return { label: host, prod: false };
  }
  const env = deriveEnv(window.location.hostname);
  $('envLabel').textContent = env.label;
  $('envPill').classList.toggle('prod', env.prod);
  $('envPill').title = window.location.hostname + (env.prod ? ' — production app: tests here have real side effects' : '');

  // ---- categories ----
  // trigger -> registry category comes from /trigger-categories.json,
  // generated from src/registry/webhook.registry.ts (see
  // scripts/generate-trigger-categories.ts). Call & Meeting merges CALLS +
  // MEETINGS the same way CometChat's own Dashboard tab does.
  const DISPLAY_CATEGORIES = [
    { key: 'GROUP', label: 'Group', registryCats: ['GROUP'], dirs: ['group'], color: 'var(--cat-group)' },
    { key: 'CALL_MEETING', label: 'Call & Meeting', registryCats: ['CALLS', 'MEETINGS'], dirs: ['calls', 'meetings'], color: 'var(--cat-call)' },
    { key: 'MESSAGE', label: 'Message', registryCats: ['MESSAGE'], dirs: ['message'], color: 'var(--cat-message)' },
    { key: 'CAMPAIGN', label: 'Campaign', registryCats: ['CAMPAIGN'], dirs: ['campaign'], color: 'var(--cat-campaign)' },
    { key: 'USER', label: 'User', registryCats: ['USER'], dirs: ['user'], color: 'var(--cat-user)' },
    { key: 'MODERATION', label: 'Moderation', registryCats: ['MODERATION'], dirs: ['moderation'], color: 'var(--cat-moderation)' },
    { key: 'LEGACY', label: 'Legacy', registryCats: ['LEGACY'], dirs: ['legacy'], color: 'var(--cat-legacy)' },
    { key: 'NOTIFICATION', label: 'Notification', registryCats: ['NOTIFICATION'], dirs: ['notification'], color: 'var(--cat-notification)' },
  ];
  const catByKey = Object.fromEntries(DISPLAY_CATEGORIES.map((c) => [c.key, c]));
  const colorOf = (key) => (catByKey[key] ? catByKey[key].color : 'var(--cat-other)');
  const labelOf = (key) => (catByKey[key] ? catByKey[key].label : key === 'SHARED' ? 'Cross-cutting' : 'Other');

  let triggerToCategory = {};
  let categoryTotals = {};

  // message_delivery_receipt / message_read_receipt are the 2 trigger names
  // Legacy shares with Modern (see legacy.registry.ts). The static map can
  // only default them to Message, but the payloads are structurally
  // distinguishable: Modern nests under data.body, Legacy's fields sit flat
  // under data (data.receiptType etc.). Live-verified 2026-09-15.
  const AMBIGUOUS_LEGACY_MESSAGE_TRIGGERS = ['message_delivery_receipt', 'message_read_receipt'];

  function displayCategoryOf(trigger, payload) {
    if (payload && AMBIGUOUS_LEGACY_MESSAGE_TRIGGERS.includes(trigger)) {
      return payload.data && payload.data.body !== undefined ? 'MESSAGE' : 'LEGACY';
    }
    const registryCat = triggerToCategory[trigger];
    const found = DISPLAY_CATEGORIES.find((c) => c.registryCats.includes(registryCat));
    return found ? found.key : 'OTHER';
  }

  // Registered totals straight from the registry — deliberately not derived
  // from triggerToCategory, which collapses Legacy's 2 shared names.
  function totalsByDisplayCategory() {
    const totals = {};
    for (const c of DISPLAY_CATEGORIES) totals[c.key] = c.registryCats.reduce((s, rc) => s + (categoryTotals[rc] || 0), 0);
    return totals;
  }

  // ---- formatting ----
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmtClock(ms) {
    const d = new Date(ms);
    return d.toLocaleTimeString(undefined, { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
  }
  // Clock time alone reads as "today", so older events also get their date.
  function fmtStamp(ms) {
    const d = new Date(ms);
    const sameDay = d.toDateString() === new Date().toDateString();
    return (sameDay ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ') + fmtClock(ms);
  }
  function fmtAgo(ms) {
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 5) return 'just now';
    if (s < 60) return s + 's ago';
    const m = Math.round(s / 60);
    if (m < 60) return m + 'm ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + 'h ago';
    return Math.round(h / 24) + 'd ago';
  }
  function fmtDuration(ms) {
    if (ms == null) return '';
    if (ms < 1000) return ms + 'ms';
    const s = ms / 1000;
    if (s < 60) return s.toFixed(1) + 's';
    const m = Math.floor(s / 60);
    const rem = Math.round(s - m * 60);
    return m + 'm ' + String(rem).padStart(2, '0') + 's';
  }
  function fmtBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1).replace(/\.0$/, '') + ' KB';
    return (n / 1024 / 1024).toFixed(1).replace(/\.0$/, '') + ' MB';
  }
  function compact(n) {
    if (n < 1000) return String(n);
    if (n < 1e6) return (n / 1000).toFixed(n < 10000 ? 1 : 0).replace(/\.0$/, '') + 'K';
    return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  }
  const plural = (n, word) => `${word}${n === 1 ? '' : 's'}`;
  function highlightJsonString(json) {
    return escapeHtml(json).replace(
      /(&quot;(\\u[a-zA-Z0-9]{4}|\\[^u]|(?!&quot;).)*?&quot;(\s*:)?|\b(true|false|null)\b|-?\d+(\.\d+)?([eE][+-]?\d+)?)/g,
      (match) => {
        let cls = 'n';
        if (match.startsWith('&quot;')) cls = /:$/.test(match) ? 'k' : 's';
        else if (/true|false|null/.test(match)) cls = 'b';
        return `<span class="${cls}">${match}</span>`;
      }
    );
  }
  const highlightJson = (obj) => highlightJsonString(JSON.stringify(obj, null, 2));

  // Failure/skip reasons often embed a raw JSON error body after a plain
  // prefix ('POST /messages failed: 403 {...}'): pretty-print just that part.
  function formatReason(text) {
    if (!text) return '';
    const start = text.indexOf('{');
    if (start === -1) return escapeHtml(text);
    try {
      return escapeHtml(text.slice(0, start)) + highlightJsonString(JSON.stringify(JSON.parse(text.slice(start)), null, 2));
    } catch {
      return escapeHtml(text);
    }
  }

  function copyText(btn, text, doneLabel = 'Copied') {
    navigator.clipboard.writeText(text).catch(() => {});
    const original = btn.dataset.label || btn.innerHTML;
    btn.dataset.label = original;
    btn.textContent = doneLabel;
    setTimeout(() => { btn.innerHTML = original; delete btn.dataset.label; }, 1200);
  }

  // ---- human-readable event summaries ----
  // Returns pre-escaped HTML. Every payload-derived value goes through
  // escapeHtml: payloads are untrusted (anyone who can message the app can
  // put arbitrary text in them).
  const who = (v) => `<span class="who">${escapeHtml(v)}</span>`;
  function clip(s, n = 70) {
    s = String(s);
    return s.length > n ? s.slice(0, n - 1) + '…' : s;
  }
  function isActionMessage(e) {
    const m = e.payload && e.payload.data && e.payload.data.message;
    return e.trigger === 'message_sent' && m && m.category === 'action';
  }
  function describeEvent(e) {
    const t = e.trigger || '';
    const d = (e.payload && e.payload.data) || {};
    try {
      if (d.message) {
        const m = d.message;
        const route = `${who(m.sender || '?')} → ${who(m.receiver || '?')}`;
        if (m.category === 'action') {
          const act = m.data && m.data.action;
          return `${route} · auto-generated <b>${escapeHtml(act || 'action')}</b> action message #${escapeHtml(m.id)}`;
        }
        const text = m.data && m.data.text;
        return `${route} · #${escapeHtml(m.id)}` + (text ? ` · <span class="quote">“${escapeHtml(clip(text))}”</span>` : '');
      }
      if (t.startsWith('group_') && d.group) {
        const g = `group ${who(d.group.guid)}`;
        const by = d.by && d.by.uid;
        const members = d.members ? Object.keys(d.members) : [];
        if (t === 'group_created') return `${g} · owner ${who(d.group.owner || members[0] || '?')}`;
        if (t === 'group_owner_transferred') return `${g} · new owner ${who(d.group.owner || '?')}` + (d.group.updatedBy ? ` · by ${who(d.group.updatedBy)}` : '');
        if (t === 'group_member_joined' || t === 'group_member_left') return `${who(members.join(', ') || '?')} ${t.endsWith('joined') ? 'joined' : 'left'} ${g}`;
        return g + (by ? ` · by ${who(by)}` : '') + (members.length ? ` · member ${who(members.join(', '))}` : '');
      }
      if (d.conversation) {
        const c = d.conversation;
        const actor = t.endsWith('unpinned') ? c.unpinnedBy : c.pinnedBy;
        return `${who(actor || '?')} ${t.endsWith('unpinned') ? 'unpinned' : 'pinned'} conversation with ${who(c.conversationWith || c.conversationId || '?')}`;
      }
      if (t === 'user_connection_status_changed' && d.user) {
        const action = d.currentConnection && d.currentConnection.action;
        return `${who(d.user.uid)} ${escapeHtml(action || d.status || 'changed')}`;
      }
      if (t === 'after_connection_status_changed' && d.user) {
        return `${who(d.user.uid)} ${escapeHtml((d.event && d.event.type) || d.user.status || 'changed')} <span class="quote">(legacy)</span>`;
      }
      if (d.body && d.body.messageId != null) {
        return `${who((d.body.user && d.body.user.uid) || d.sender || '?')} ${escapeHtml(d.body.action || 'receipt')} #${escapeHtml(d.body.messageId)}`;
      }
      if (d.receiptType && d.messageId != null) {
        return `${who(d.receiptSender || '?')} ${escapeHtml(d.receiptType)} #${escapeHtml(d.messageId)} <span class="quote">(legacy)</span>`;
      }
      if (d.reaction) {
        const by = d.reaction.reactedBy && d.reaction.reactedBy.uid;
        return `${who(by || '?')} ${t.endsWith('removed') ? 'removed' : 'reacted'} ${escapeHtml(d.reaction.reaction || '')} on #${escapeHtml(d.reaction.messageId)}`;
      }
      if (d.by && d.users) {
        return `${who(d.by.uid)} ${t === 'user_unblocked' ? 'unblocked' : 'blocked'} ${who(Object.keys(d.users).join(', '))}`;
      }
      if (d.call) {
        const c = d.call;
        return `${who(c.sender || '?')} → ${who(c.receiver || '?')} · ${escapeHtml((c.data && c.data.action) || c.status || 'call')}`;
      }
      if (d.sessionId) {
        const occ = d.occupant && d.occupant.uid;
        return `session ${who(clip(d.sessionId, 28))}` + (occ ? ` · ${who(occ)}` : '');
      }
      if (d.to && d.notificationDetails) {
        const n = d.notificationDetails;
        return `push to ${who(d.to.uid)} · ${escapeHtml(n.type || '')} from ${who(n.sender || '?')}` + (n.body ? ` · <span class="quote">“${escapeHtml(clip(n.body, 50))}”</span>` : '');
      }
      if (d.to && (d.subject || d.smsContent)) {
        const kind = d.subject ? 'email' : 'sms';
        return `${kind} to ${who(d.to.uid)}` + (d.senderDetails ? ` from ${who(d.senderDetails.uid)}` : '') + ` · <span class="quote">“${escapeHtml(clip(d.subject || d.smsContent, 50))}”</span>`;
      }
      if (t.startsWith('after_campaign_')) {
        return `campaign ${who(clip(d.name || d.campaignId || '?', 40))} · ${escapeHtml(d.status || '')}` +
          (d.sentCount != null ? ` · sent ${escapeHtml(d.sentCount)}` : '') + (d.failedCount ? ` · failed ${escapeHtml(d.failedCount)}` : '');
      }
      if (t.startsWith('after_push_notification_')) {
        return `push ${escapeHtml(t.replace('after_push_notification_', ''))}` + (d.receiver ? ` → ${who(d.receiver)}` : '') + (d.channelType ? ` · ${escapeHtml(d.channelType)}` : '');
      }
      if (t.startsWith('after_feed_item_')) {
        return `feed item ${escapeHtml(t.replace('after_feed_item_', ''))}` + (d.receiver ? ` → ${who(d.receiver)}` : '') + (d.status ? ` · ${escapeHtml(d.status)}` : '');
      }
      if (t === 'after_notification_created') {
        return `notification ${who(clip(d.label || d.notificationId || '?', 40))}` + (d.sendMode ? ` · ${escapeHtml(d.sendMode)}` : '');
      }
      if (d.sender && d.data && d.data.text != null) {
        return `${who(d.sender)} → ${who(d.receiver || '?')} · <span class="quote">“${escapeHtml(clip(d.data.text))}”</span> <span class="quote">(legacy)</span>`;
      }
    } catch { /* fall through to the key list */ }
    const keys = Object.keys(d);
    return `<span class="quote">${escapeHtml(keys.length ? keys.join(', ') : '(no data)')}</span>`;
  }

  // ---- duplicate-delivery detection ----
  // Fingerprints an event by the identifying field its payload carries, so
  // two DIFFERENT actions of one trigger aren't flagged — only re-deliveries
  // of the same underlying event, landing within DUPLICATE_WINDOW_MS (matches
  // src/utils/timeout.ts's DUPLICATE_SETTLE_WINDOW_MS plus headroom).
  // Presence is excluded: it legitimately repeats for unrelated sessions.
  function fingerprint(e) {
    if (PRESENCE_TRIGGERS.includes(e.trigger)) return null;
    const d = e.payload && e.payload.data;
    if (!d) return null;
    if (d.message && d.message.id != null) return 'message:' + d.message.id;
    if (d.group && d.group.guid) return 'group:' + d.group.guid;
    if (d.call && d.call.id != null) return 'call:' + d.call.id;
    if (d.body && d.body.messageId != null) return 'receipt:' + d.body.messageId + ':' + d.body.action;
    if (d.reaction && d.reaction.messageId != null) {
      return 'reaction:' + d.reaction.messageId + ':' + d.reaction.reaction + ':' + (d.reaction.reactedBy && d.reaction.reactedBy.uid);
    }
    if (d.by && d.by.uid && d.users) return 'userstate:' + d.by.uid + ':' + Object.keys(d.users).sort().join(',');
    return null;
  }
  const DUPLICATE_WINDOW_MS = 5000;
  // A redelivery carries the exact same payload. Keying on the fingerprint
  // alone produced a false positive on real prod-us data: two
  // moderation_engine_blocked events for message 5977, 4.9s apart, same
  // text, differing only in data.moderation — two separate evaluations, not
  // a duplicate. Every genuine duplicate in that data (19 repeated
  // message_delivery_receipt deliveries, one message acked 6x within 100ms)
  // was byte-identical, so requiring an identical payload keeps all of them
  // and drops the false positive.
  const payloadKeyCache = new Map();
  function payloadKey(e) {
    const id = eventId(e);
    let k = payloadKeyCache.get(id);
    if (k == null) { k = JSON.stringify(e.payload || {}); payloadKeyCache.set(id, k); }
    return k;
  }
  function computeDuplicates(events) {
    const groups = new Map();
    for (const e of events) {
      const fp = fingerprint(e);
      if (fp == null) continue;
      const key = (e.trigger || '') + '|' + fp + '|' + payloadKey(e);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(e);
    }
    const dupInfo = new Map();
    for (const list of groups.values()) {
      if (list.length < 2) continue;
      list.sort((a, b) => a.receivedAt - b.receivedAt);
      let clusterStart = 0;
      for (let i = 1; i <= list.length; i++) {
        const end = i === list.length || list[i].receivedAt - list[i - 1].receivedAt > DUPLICATE_WINDOW_MS;
        if (end) {
          const cluster = list.slice(clusterStart, i);
          if (cluster.length > 1) {
            cluster.forEach((e, idx) => dupInfo.set(eventId(e), { index: idx + 1, count: cluster.length, deltaMs: e.receivedAt - cluster[0].receivedAt }));
          }
          clusterStart = i;
        }
      }
    }
    return dupInfo;
  }
  function eventId(e) {
    return (e.id || e.receivedAt) + ':' + (e.trigger || '');
  }

  // Events recorded before the receiver captured size keep an estimate.
  const sizeCache = new Map();
  const encoder = new TextEncoder();
  function sizeOf(e) {
    if (typeof e.size === 'number') return e.size;
    const id = eventId(e);
    if (!sizeCache.has(id)) sizeCache.set(id, encoder.encode(JSON.stringify(e.payload || {})).length);
    return sizeCache.get(id);
  }

  // Result lists are rebuilt via innerHTML, which destroys whatever element
  // had keyboard focus. Put focus back on the same card's control so
  // keyboard users never lose their place.
  function preserveFocus(container, rebuild) {
    const active = document.activeElement;
    const card = active && container.contains(active) ? active.closest('.card') : null;
    const id = card && card.dataset.id;
    const onCopy = Boolean(active && active.matches('[data-copy-reason]'));
    rebuild();
    if (!id) return;
    const next = [...container.querySelectorAll('.card')].find((c) => c.dataset.id === id);
    const target = next && (onCopy ? next.querySelector('[data-copy-reason]') : next.querySelector('.card-head'));
    if (target) target.focus({ preventScroll: true });
  }

  // ---- shared tooltip (enhances only — every value is also in text/table) ----
  function showTip(target, value, label) {
    tipEl.querySelector('.v').textContent = value;
    tipEl.querySelector('.l').textContent = label;
    tipEl.style.display = 'block';
    const r = target.getBoundingClientRect();
    const tw = tipEl.offsetWidth;
    const left = Math.min(window.innerWidth - tw - 8, Math.max(8, r.left + r.width / 2 - tw / 2));
    tipEl.style.left = left + 'px';
    tipEl.style.top = Math.max(8, r.top - tipEl.offsetHeight - 8) + 'px';
  }
  const hideTip = () => { tipEl.style.display = 'none'; };
  document.addEventListener('pointerover', (ev) => {
    const t = ev.target.closest('[data-tip-v]');
    if (t) showTip(t, t.dataset.tipV, t.dataset.tipL || '');
  });
  document.addEventListener('pointerout', (ev) => { if (ev.target.closest('[data-tip-v]')) hideTip(); });
  document.addEventListener('focusin', (ev) => {
    const t = ev.target.closest('[data-tip-v]');
    if (t) showTip(t, t.dataset.tipV, t.dataset.tipL || ''); else hideTip();
  });
  window.addEventListener('scroll', hideTip, { passive: true, capture: true });

  // =====================================================================
  // Live events
  // =====================================================================
  let allEvents = [];            // everything the receiver has, oldest first
  const knownIds = new Set();
  let historyEpoch = null;       // see /webhook/history in index.js
  let paused = false;
  let frozenEvents = null;       // what stays on screen while paused
  let frozenAt = null;
  let selectedId = null;
  let shownIds = [];             // list order, newest first
  const seenEventIds = new Set();
  let seeded = false;            // first load doesn't flash every row as "new"
  const searchCache = new Map();
  let lastListKey = '';
  let lastDetailKey = '';
  let lastFilterSig = '';
  let timelineSlice = [];
  let dupInfoAll = new Map();
  const MAX_ROWS = 400;          // keep the DOM light; search/filters reach the rest

  const endpointUrl = window.location.origin + '/webhook';
  $('endpoint').innerHTML = `${escapeHtml(window.location.host)}<span class="path">/webhook</span>`;
  $('copyEndpoint').addEventListener('click', (ev) => copyText(ev.currentTarget, endpointUrl, '✓'));

  const visibleEvents = () => (paused ? frozenEvents : allEvents);

  function searchTextOf(e) {
    const id = eventId(e);
    let s = searchCache.get(id);
    if (s == null) {
      s = ((e.trigger || '') + ' ' + (e.ip || '') + ' ' + JSON.stringify(e.payload || {})).toLowerCase();
      searchCache.set(id, s);
    }
    return s;
  }

  // viewFilter values: '' | 'cat:<KEY>' | 'trig:<KEY>:<trigger>'. A trigger
  // option carries its category because Legacy and Message share 2 names.
  function parseFilter() {
    const v = filterEl.value;
    if (v.startsWith('cat:')) return { cat: v.slice(4), trig: '' };
    if (v.startsWith('trig:')) {
      const rest = v.slice(5);
      const i = rest.indexOf(':');
      return { cat: rest.slice(0, i), trig: rest.slice(i + 1) };
    }
    return { cat: '', trig: '' };
  }

  // One filter row scopes everything below it: timeline, metrics and list
  // all read from this same slice so their numbers always agree.
  function sliceEvents(events) {
    const q = searchEl.value.trim().toLowerCase();
    const { cat, trig } = parseFilter();
    // Picking the presence trigger itself overrides "Hide presence".
    const hidePresence = hidePresenceEl.checked && !PRESENCE_TRIGGERS.includes(trig);
    return events.filter((e) => {
      if (hidePresence && PRESENCE_TRIGGERS.includes(e.trigger)) return false;
      if (cat && displayCategoryOf(e.trigger, e.payload) !== cat) return false;
      if (trig && e.trigger !== trig) return false;
      if (q && !searchTextOf(e).includes(q)) return false;
      return true;
    });
  }

  // The category/trigger picker doubles as the coverage view: each group
  // says how many of its registered webhook types have fired so far.
  function updateFilterOptions(events) {
    const pairs = new Map(); // cat -> Set(trigger)
    for (const e of events) {
      if (!e.trigger) continue;
      const cat = displayCategoryOf(e.trigger, e.payload);
      if (!pairs.has(cat)) pairs.set(cat, new Set());
      pairs.get(cat).add(e.trigger);
    }
    const sig = [...pairs].map(([c, s]) => c + '=' + [...s].sort().join(',')).sort().join('|') + '#' + Object.keys(categoryTotals).length;
    if (sig === lastFilterSig) return;
    lastFilterSig = sig;

    const current = filterEl.value;
    const totals = totalsByDisplayCategory();
    const grand = Object.values(categoryTotals).reduce((a, b) => a + b, 0);
    const allFired = new Set(events.map((e) => e.trigger).filter(Boolean)).size;
    const cats = DISPLAY_CATEGORIES.map((c) => c.key).concat(pairs.has('OTHER') ? ['OTHER'] : []);
    let html = `<option value="">All webhooks${grand ? ` — ${allFired}/${grand} types fired` : ''}</option>`;
    const values = new Set(['']);
    for (const key of cats) {
      const fired = pairs.get(key) || new Set();
      const total = totals[key];
      html += `<optgroup label="${escapeHtml(labelOf(key))}${total ? ` — ${fired.size}/${total} fired` : ''}">`;
      html += `<option value="cat:${escapeHtml(key)}">All ${escapeHtml(labelOf(key))}</option>`;
      values.add('cat:' + key);
      for (const t of [...fired].sort()) {
        html += `<option value="trig:${escapeHtml(key)}:${escapeHtml(t)}">${escapeHtml(t)}</option>`;
        values.add(`trig:${key}:${t}`);
      }
      html += '</optgroup>';
    }
    // Keep a chosen trigger selectable after a Clear wipes its events.
    if (current && !values.has(current)) {
      html += `<option value="${escapeHtml(current)}">${escapeHtml(current.split(':').pop())} (no events yet)</option>`;
    }
    filterEl.innerHTML = html;
    filterEl.value = current;
  }

  // ---- timeline ----
  // A fixed 60 columns; the window picks how much time each one covers.
  const WINDOWS = {
    '1m': { span: 60 * 1000, start: '60s ago' },
    '15m': { span: 15 * 60 * 1000, start: '15 min ago' },
    '1h': { span: 60 * 60 * 1000, start: '1 hour ago' },
  };
  const BUCKETS = 60;
  let windowKey = loadPref('window', '15m');
  if (!WINDOWS[windowKey]) windowKey = '15m';
  timelineEl.innerHTML = Array.from({ length: BUCKETS }, (_, i) => `<div class="tcol zero" data-i="${i}"><div class="tbar"></div></div>`).join('');
  const tcols = [...timelineEl.children];
  let bucketBounds = [];

  function renderWindowSeg() {
    for (const b of $('windowSeg').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.window === windowKey));
    $('axisStart').textContent = WINDOWS[windowKey].start;
  }

  function renderTimeline() {
    const { span } = WINDOWS[windowKey];
    const size = span / BUCKETS;
    // Edges snap to whole buckets so bars step left cleanly instead of jittering.
    const end = Math.ceil((paused && frozenAt ? frozenAt : Date.now()) / size) * size;
    const start = end - span;
    const counts = new Array(BUCKETS).fill(0);
    const selected = selectedId && timelineSlice.find((e) => eventId(e) === selectedId);
    // Arrival order means the newest are at the end: stop at the window's start.
    for (let i = timelineSlice.length - 1; i >= 0; i--) {
      const t = timelineSlice[i].receivedAt;
      if (t < start) break;
      counts[Math.min(BUCKETS - 1, Math.floor((t - start) / size))]++;
    }
    const selBucket = selected && selected.receivedAt >= start ? Math.min(BUCKETS - 1, Math.floor((selected.receivedAt - start) / size)) : -1;
    const max = Math.max(1, ...counts);
    const clockOpts = size < 60000 ? { hour12: false } : { hour: '2-digit', minute: '2-digit', hour12: false };
    const fmt = (ms) => new Date(ms).toLocaleTimeString(undefined, clockOpts);
    bucketBounds = counts.map((_, i) => [start + i * size, start + (i + 1) * size]);
    counts.forEach((v, i) => {
      const col = tcols[i];
      col.classList.toggle('zero', v === 0);
      col.classList.toggle('has-sel', i === selBucket);
      col.firstChild.style.height = v ? Math.max(3, Math.round((100 * v) / max)) + '%' : '0';
      col.dataset.tipV = `${v} ${plural(v, 'request')}`;
      col.dataset.tipL = `${fmt(bucketBounds[i][0])} – ${fmt(bucketBounds[i][1])}`;
    });
    const total = counts.reduce((a, b) => a + b, 0);
    timelineEl.setAttribute('aria-label', `${total} ${plural(total, 'request')} in the last ${WINDOWS[windowKey].start.replace(' ago', '')}, busiest interval ${Math.max(...counts)}`);
  }

  function renderTimelineTable() {
    $('timelineTable').innerHTML =
      '<caption>Requests per interval in the timeline window</caption><tr><th>From</th><th>Requests</th></tr>' +
      bucketBounds.map(([from], i) => `<tr><td>${escapeHtml(fmtClock(from))}</td><td>${escapeHtml(tcols[i].dataset.tipV)}</td></tr>`).join('');
  }

  $('windowSeg').addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-window]');
    if (!b) return;
    windowKey = b.dataset.window;
    savePref('window', windowKey);
    renderWindowSeg();
    renderTimeline();
    renderTimelineTable();
  });

  // Clicking a bar jumps to the newest request in that interval.
  timelineEl.addEventListener('click', (ev) => {
    const col = ev.target.closest('.tcol');
    if (!col || col.classList.contains('zero')) return;
    const [from, to] = bucketBounds[Number(col.dataset.i)];
    for (let i = timelineSlice.length - 1; i >= 0; i--) {
      const t = timelineSlice[i].receivedAt;
      if (t >= from && t < to) { selectEvent(eventId(timelineSlice[i]), { scroll: true, open: true }); return; }
      if (t < from) return;
    }
  });

  // ---- metrics ----
  function renderMetrics(events, slice) {
    const { cat } = parseFilter();
    const types = new Set(slice.map((e) => e.trigger).filter(Boolean));
    const totals = totalsByDisplayCategory();
    const denom = cat ? totals[cat] : Object.values(categoryTotals).reduce((a, b) => a + b, 0);
    // Exactly-once: every delivery after the first of an identical burst.
    let extra = 0;
    for (const e of slice) {
      const d = dupInfoAll.get(eventId(e));
      if (d && d.index > 1) extra++;
    }
    const actions = slice.filter(isActionMessage).length;
    $('metrics').innerHTML = `
      <span class="metric"><span><b>${compact(slice.length)}</b>${slice.length !== events.length ? ` of ${compact(events.length)}` : ''} ${plural(events.length, 'request')}</span></span>
      <span class="metric"><span><b>${types.size}</b>${denom ? ` / ${denom}` : ''} webhook types ${cat ? 'in ' + escapeHtml(labelOf(cat)) : 'in view'}</span></span>
      <span class="metric"><span class="status-dot" style="background:${extra ? 'var(--critical)' : 'var(--good)'}"></span><span><b>${compact(extra)}</b> duplicate ${extra === 1 ? 'delivery' : 'deliveries'} · ${extra ? 'identical payload redelivered' : 'exactly-once holds'}</span></span>
      <span class="metric" title="Editing or deleting a message auto-creates an &quot;action&quot; message that fires its own message_sent — a known CometChat bug (edit fires 3, delete fires 1).">
        <span class="status-dot" style="background:${actions ? 'var(--serious)' : 'var(--good)'}"></span><span><b>${compact(actions)}</b> side-effect message_sent</span></span>`;
  }

  // ---- list ----
  function rowFlags(e) {
    const dup = dupInfoAll.get(eventId(e));
    let html = '';
    if (dup) html += `<span class="flag" title="Identical payload, delivery ${dup.index} of ${dup.count}"><span class="status-dot" style="background:var(--critical)"></span>dup ${dup.index}/${dup.count}</span>`;
    if (isActionMessage(e)) html += `<span class="flag" title="Auto-generated by an edit/delete — known CometChat bug"><span class="status-dot" style="background:var(--serious)"></span>side effect</span>`;
    return html;
  }

  function renderRow(e, isNew) {
    const id = eventId(e);
    const sel = id === selectedId;
    const cat = displayCategoryOf(e.trigger, e.payload);
    const meta = [e.ip, fmtBytes(sizeOf(e))].filter(Boolean).map(escapeHtml).join(' · ');
    return `
    <button type="button" class="row ${sel ? 'sel' : ''} ${isNew ? 'row--new' : ''}" role="option" aria-selected="${sel}" tabindex="${sel ? 0 : -1}" data-id="${escapeHtml(id)}">
      <span class="row-top">
        <span class="swatch" style="background:${colorOf(cat)}" title="${escapeHtml(labelOf(cat))}"></span>
        <span class="row-trigger">${escapeHtml(e.trigger || 'unknown')}</span>
        ${rowFlags(e)}
        <span class="row-time" title="${escapeHtml(fmtAgo(e.receivedAt))}">${escapeHtml(fmtStamp(e.receivedAt))}</span>
      </span>
      <span class="row-sum">${describeEvent(e)}</span>
      <span class="row-meta">${meta}</span>
    </button>`;
  }

  function renderList(events, slice) {
    const shown = slice.slice(-MAX_ROWS).reverse();
    shownIds = shown.map(eventId);

    const newIds = new Set();
    for (const e of events) {
      const id = eventId(e);
      if (seeded && !seenEventIds.has(id)) newIds.add(id);
      seenEventIds.add(id);
    }
    seeded = true;

    if (!events.length || !slice.length) {
      lastListKey = '';
      listEl.innerHTML = !events.length
        ? `<div class="pane-empty"><b>No webhooks yet.</b><br />Point CometChat at <code>${escapeHtml(endpointUrl)}</code> and trigger an action — it shows up here within a couple of seconds.</div>`
        : `<div class="pane-empty"><b>Nothing matches this view.</b><br />Clear the filter or pick another category${hidePresenceEl.checked ? ', or show presence events' : ''}.</div>`;
      return;
    }

    const key = shownIds.join('|') + '#' + [...dupInfoAll.keys()].join(',') + '#' + Object.keys(triggerToCategory).length;
    if (key === lastListKey) return syncSelection();
    lastListKey = key;

    // New rows land on top: keep whatever the reader is looking at in place.
    const anchor = listEl.scrollTop > 0 ? [...listEl.children].find((r) => r.offsetTop + r.offsetHeight > listEl.scrollTop) : null;
    const anchorId = anchor && anchor.dataset.id;
    const anchorOffset = anchor ? anchor.offsetTop - listEl.scrollTop : 0;
    const hadFocus = listEl.contains(document.activeElement);

    listEl.innerHTML =
      shown.map((e) => renderRow(e, newIds.has(eventId(e)))).join('') +
      (slice.length > MAX_ROWS ? `<div class="list-note">Showing the newest ${MAX_ROWS} of ${compact(slice.length)} — narrow it with the filter.</div>` : '');

    if (anchorId) {
      const again = listEl.querySelector(`[data-id="${CSS.escape(anchorId)}"]`);
      if (again) listEl.scrollTop = again.offsetTop - anchorOffset;
    }
    if (hadFocus) {
      const row = listEl.querySelector('.row.sel') || listEl.querySelector('.row');
      if (row) row.focus({ preventScroll: true });
    }
  }

  function syncSelection() {
    for (const r of listEl.querySelectorAll('.row')) {
      const sel = r.dataset.id === selectedId;
      r.classList.toggle('sel', sel);
      r.setAttribute('aria-selected', String(sel));
      r.tabIndex = sel ? 0 : -1;
    }
  }

  // ---- detail ----
  function findEvent(id) {
    const events = visibleEvents();
    for (let i = events.length - 1; i >= 0; i--) if (eventId(events[i]) === id) return events[i];
    return null;
  }

  function deliveryFact(e) {
    const dup = dupInfoAll.get(eventId(e));
    if (dup) {
      return `<span class="status-dot" style="background:var(--critical)"></span>Duplicate — delivery ${dup.index} of ${dup.count}` +
        (dup.index > 1 ? ` <span class="quote">+${escapeHtml(fmtDuration(dup.deltaMs))} after the first</span>` : ' <span class="quote">(the first)</span>');
    }
    if (fingerprint(e) == null) return `<span class="quote">Not checked — this payload has no stable id to compare</span>`;
    return `<span class="status-dot" style="background:var(--good)"></span>Once <span class="quote">no identical redelivery within ${DUPLICATE_WINDOW_MS / 1000}s</span>`;
  }

  function renderDetail() {
    const e = selectedId && findEvent(selectedId);
    const dup = e ? dupInfoAll.get(selectedId) : null;
    const key = (e ? selectedId : '') + '#' + (dup ? dup.index + '/' + dup.count : '') + '#' + Object.keys(triggerToCategory).length;
    if (key === lastDetailKey) return;
    lastDetailKey = key;

    if (!e) {
      detailEl.innerHTML = visibleEvents().length ? '<div class="pane-empty">Select a request to inspect it.</div>' : '';
      return;
    }
    const cat = displayCategoryOf(e.trigger, e.payload);
    const headers = Object.entries(e.headers || {}).sort(([a], [b]) => a.localeCompare(b));
    const legacyHeaders = headers.length <= 1;
    const size = sizeOf(e);
    detailEl.innerHTML = `
      <div class="detail">
        <button class="btn small back" type="button" data-back>← All requests</button>
        <div class="detail-head">
          <h2 class="detail-trigger">${escapeHtml(e.trigger || 'unknown')}</h2>
          <span class="cat-tag"><span class="swatch" style="background:${colorOf(cat)}"></span>${escapeHtml(labelOf(cat))}</span>
          ${rowFlags(e)}
        </div>
        <p class="detail-summary">${describeEvent(e)}</p>
        <dl class="facts">
          <dt>Received</dt><dd>${escapeHtml(fmtStamp(e.receivedAt))} <span class="quote" data-ago="${e.receivedAt}">${escapeHtml(fmtAgo(e.receivedAt))}</span></dd>
          <dt>Request</dt><dd>${escapeHtml(e.method || 'POST')} ${escapeHtml(e.path || '/webhook')}</dd>
          <dt>Source IP</dt><dd>${e.ip ? escapeHtml(e.ip) : '<span class="quote">not recorded</span>'}</dd>
          <dt>Size</dt><dd>${escapeHtml(fmtBytes(size))}${size >= 1024 ? ` <span class="quote">${escapeHtml(size.toLocaleString())} bytes</span>` : ''}${typeof e.size === 'number' ? '' : ' <span class="quote">estimated</span>'}</dd>
          <dt>Delivery</dt><dd>${deliveryFact(e)}</dd>
          <dt>Event ID</dt><dd>${escapeHtml(e.id || '—')}</dd>
        </dl>
        <section>
          <div class="sec-title">Body <button class="btn small" type="button" data-copy-body>Copy JSON</button></div>
          <pre class="body-pre">${highlightJson(e.payload)}</pre>
        </section>
        <section>
          <div class="sec-title">Headers <span class="n">${headers.length}</span></div>
          ${headers.length ? `<table class="htable"><tbody>${headers.map(([k, v]) => `<tr><th scope="row">${escapeHtml(k)}</th><td>${escapeHtml(Array.isArray(v) ? v.join(', ') : v ?? '')}</td></tr>`).join('')}</tbody></table>` : ''}
          ${legacyHeaders ? '<p class="note">Received before this receiver recorded full request headers.</p>' : ''}
        </section>
      </div>`;
  }

  detailEl.addEventListener('click', (ev) => {
    if (ev.target.closest('[data-back]')) return closeDetail();
    const copy = ev.target.closest('[data-copy-body]');
    if (copy) {
      const e = findEvent(selectedId);
      if (e) copyText(copy, JSON.stringify(e.payload, null, 2));
    }
  });

  // ---- selection ----
  function selectEvent(id, { scroll = false, focus = false, open = false } = {}) {
    selectedId = id;
    syncSelection();
    renderDetail();
    renderTimeline();
    const row = listEl.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (row && scroll) row.scrollIntoView({ block: 'nearest' });
    if (row && focus) row.focus({ preventScroll: !scroll });
    if (open && narrow.matches) {
      panesEl.classList.add('show-detail');
      detailEl.scrollTop = 0;
      // Land just under the sticky header, with the back button in view.
      window.scrollTo({ top: panesEl.getBoundingClientRect().top + window.scrollY - $('appHeader').offsetHeight - 8 });
    }
  }
  function closeDetail() {
    panesEl.classList.remove('show-detail');
    const row = listEl.querySelector('.row.sel');
    if (row) { row.scrollIntoView({ block: 'center' }); row.focus({ preventScroll: true }); }
  }
  function moveSelection(delta) {
    if (!shownIds.length) return;
    const i = shownIds.indexOf(selectedId);
    const next = i === -1 ? 0 : Math.min(shownIds.length - 1, Math.max(0, i + delta));
    selectEvent(shownIds[next], { scroll: true, focus: true });
  }

  listEl.addEventListener('click', (ev) => {
    const row = ev.target.closest('.row');
    if (row) selectEvent(row.dataset.id, { open: true });
  });
  listEl.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      moveSelection(ev.key === 'ArrowDown' ? 1 : -1);
    } else if (ev.key === 'Home' || ev.key === 'End') {
      ev.preventDefault();
      if (shownIds.length) selectEvent(ev.key === 'Home' ? shownIds[0] : shownIds[shownIds.length - 1], { scroll: true, focus: true });
    }
  });
  // j/k step through requests and / jumps to the filter, anywhere but a text field.
  document.addEventListener('keydown', (ev) => {
    if (activeTab !== 'events' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const typing = ev.target.closest('input, select, textarea');
    if (ev.key === 'Escape') {
      if (typing === searchEl && searchEl.value) { searchEl.value = ''; rerender(); }
      else if (panesEl.classList.contains('show-detail')) closeDetail();
      return;
    }
    if (typing) return;
    if (ev.key === '/') { ev.preventDefault(); searchEl.focus(); }
    else if (ev.key === 'j' || ev.key === 'k') { ev.preventDefault(); moveSelection(ev.key === 'j' ? 1 : -1); }
  });

  // ---- render ----
  function render() {
    const events = visibleEvents();
    updateFilterOptions(events);
    const slice = sliceEvents(events);
    dupInfoAll = computeDuplicates(events); // duplicates are real regardless of the filter
    timelineSlice = slice;

    const presence = events.filter((e) => PRESENCE_TRIGGERS.includes(e.trigger)).length;
    $('presenceCount').textContent = presence ? compact(presence) : '';

    renderList(events, slice);
    // Keep the selection while it's still in view; otherwise fall back to the
    // newest request (desktop only — on a phone the list stays in charge).
    if (!selectedId || !shownIds.includes(selectedId)) {
      selectedId = shownIds.length && !narrow.matches ? shownIds[0] : null;
      if (!selectedId) panesEl.classList.remove('show-detail');
      syncSelection();
    }
    renderMetrics(events, slice);
    renderTimeline();
    renderTimelineTable();
    renderDetail();
    renderLiveState();
  }
  function rerender() {
    lastListKey = '';
    lastDetailKey = '';
    render();
  }

  // ---- live / pause ----
  let connected = true;
  function renderLiveState() {
    const waiting = paused ? Math.max(0, allEvents.length - frozenEvents.length) : 0;
    pauseBtn.innerHTML = paused
      ? `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 3v10l8-5z"/></svg>Resume${waiting ? ` <span class="n">${compact(waiting)} new</span>` : ''}`
      : `<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="3" height="10" rx="1"/><rect x="9" y="3" width="3" height="10" rx="1"/></svg>Pause`;
    pauseBtn.classList.toggle('on', paused);
    pauseBtn.setAttribute('aria-pressed', String(paused));
    const state = !connected ? 'offline' : paused ? 'paused' : 'live';
    if ($('liveState').dataset.state !== state) {
      $('liveState').dataset.state = state;
      $('liveState').innerHTML =
        state === 'live' ? '<span class="live-dot"></span>Live'
        : state === 'paused' ? '<span class="pause-mark"></span>Paused'
        : '<span class="status-dot" style="background:var(--critical)"></span>Offline';
    }
  }
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    frozenEvents = paused ? allEvents.slice() : null;
    frozenAt = paused ? Date.now() : null;
    rerender();
  });

  // ---- fetching ----
  // After the first full load, only events newer than the last one we hold
  // are fetched. A changed epoch means the history was wiped (a Clear, or a
  // new test run's clear-history.ts) or the receiver restarted: reload it all.
  // A receiver without epochs (older deploy) is fetched in full every time.
  function resetEvents(events, epoch) {
    allEvents = events;
    knownIds.clear();
    for (const e of allEvents) knownIds.add(eventId(e));
    historyEpoch = epoch ?? null;
  }
  async function fetchHistory() {
    const incremental = historyEpoch != null && allEvents.length > 0;
    const url = incremental ? '/webhook/history?since=' + allEvents[allEvents.length - 1].receivedAt : '/webhook/history';
    const json = await (await fetch(url, { cache: 'no-store' })).json();
    if (!incremental) return resetEvents(json.events || [], json.epoch);
    if (json.epoch !== historyEpoch) {
      historyEpoch = null;
      return fetchHistory();
    }
    // `since` is inclusive, so the last event we already have comes back too.
    for (const e of json.events || []) {
      const id = eventId(e);
      if (!knownIds.has(id)) { knownIds.add(id); allEvents.push(e); }
    }
  }

  function setConnected(ok) {
    connected = ok;
    dotEl.classList.toggle('off', !ok);
    statusText.textContent = ok ? 'Connected' : 'Disconnected';
  }

  async function poll() {
    try {
      await fetchHistory();
      setConnected(true);
      if (searchCache.size > 20000) searchCache.clear();
      if (payloadKeyCache.size > 20000) payloadKeyCache.clear();
      if (sizeCache.size > 20000) sizeCache.clear();
      if (activeTab === 'events') render(); else renderLiveState();
    } catch {
      setConnected(false);
      renderLiveState();
    }
  }

  filterEl.addEventListener('change', rerender);
  let searchTimer;
  searchEl.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(rerender, 120); });
  hidePresenceEl.addEventListener('change', () => { savePref('hidePresence', hidePresenceEl.checked); rerender(); });

  $('clearBtn').addEventListener('click', async () => {
    if (!confirm('Clear all stored webhooks and the last test results on this receiver?')) return;
    await Promise.all([fetch('/webhook/history', { method: 'DELETE' }), fetch('/test-results', { method: 'DELETE' })]);
    paused = false;
    frozenEvents = null;
    frozenAt = null;
    selectedId = null;
    resetEvents([], null);
    seenEventIds.clear();
    openResultIds.clear();
    lastResultsRenderKey = '';
    panesEl.classList.remove('show-detail');
    rerender();
    poll();
    pollResults();
  });

  fetch('/trigger-categories.json')
    .then((r) => r.json())
    .then((data) => {
      triggerToCategory = data.triggerToCategory || {};
      categoryTotals = data.categoryTotals || {};
      lastFilterSig = '';
      if (activeTab === 'events') rerender();
      else { lastResultsRenderKey = ''; renderResults(lastResultsData); }
    })
    .catch(() => {}); // categorization is a nice-to-have — events still render, just under "Other"

  // =====================================================================
  // Test results
  // =====================================================================
  const resultsListEl = $('resultsList');
  const resultsEmptyEl = $('resultsEmpty');
  const openResultIds = new Set();
  const reasonById = new Map();
  let resultsStatus = '';
  let resultsArea = '';
  let lastResultsRenderKey = '';
  let lastResultsData = { tests: [], counts: {}, available: false };
  // Flash rows that arrive while you watch — but not everything on first
  // load, and restart the "seen" set when a new run begins.
  const seenResultIds = new Set();
  let resultsSeeded = false;
  let lastRunStart = null;
  let lastSidebarKey = '';
  let lastStatsKey = '';
  let activeTab = 'events';

  const STATUS_META = {
    passed: { label: 'Passed', color: 'var(--good)' },
    failed: { label: 'Failed', color: 'var(--critical)' },
    'expected-fail': { label: 'Known CometChat bug', color: 'var(--serious)' },
    delayed: { label: 'Delayed', color: 'var(--warning)' },
    skipped: { label: 'Skipped', color: 'var(--neutral)' },
    blocked: { label: 'Blocked', color: 'var(--neutral)' },
  };
  const STATUS_ORDER = ['failed', 'expected-fail', 'delayed', 'passed', 'skipped', 'blocked'];

  function areaOfTest(t) {
    const dir = String(t.file || '').split('/')[0];
    if (dir === '_shared') return 'SHARED';
    const c = DISPLAY_CATEGORIES.find((x) => x.dirs.includes(dir));
    return c ? c.key : 'OTHER';
  }

  function setTab(tab) {
    activeTab = tab;
    const onEvents = tab === 'events';
    $('tabEvents').classList.toggle('active', onEvents);
    $('tabResults').classList.toggle('active', !onEvents);
    $('tabEvents').setAttribute('aria-selected', String(onEvents));
    $('tabResults').setAttribute('aria-selected', String(!onEvents));
    $('eventsView').hidden = !onEvents;
    $('resultsView').hidden = onEvents;
    document.body.classList.toggle('on-events', onEvents);
    hideTip();
    if (onEvents) rerender();
    else { lastResultsRenderKey = ''; lastSidebarKey = ''; lastStatsKey = ''; renderResults(lastResultsData); pollResults(); }
  }
  $('tabEvents').addEventListener('click', () => setTab('events'));
  $('tabResults').addEventListener('click', () => setTab('results'));

  function renderResultsSidebar(tests) {
    const byArea = {};
    for (const t of tests) {
      const a = areaOfTest(t);
      const r = (byArea[a] = byArea[a] || { passed: 0, failed: 0, 'expected-fail': 0, delayed: 0, skipped: 0, blocked: 0, total: 0 });
      r[t.category] = (r[t.category] || 0) + 1;
      r.total++;
    }
    const areas = [{ key: '', label: 'All tests' }]
      .concat(DISPLAY_CATEGORIES.map((c) => ({ key: c.key, label: c.label })))
      .concat([{ key: 'SHARED', label: 'Cross-cutting' }])
      .filter((a) => a.key === '' || byArea[a.key]);
    const all = tests.reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + 1; return acc; }, {});

    const SEGS = ['passed', 'expected-fail', 'failed', 'delayed'];
    sidebarEl.innerHTML =
      `<div class="side-title">Results by category</div>
       <div class="side-legend">${SEGS.map((s) => `<span><span class="swatch" style="background:${STATUS_META[s].color}"></span>${s === 'expected-fail' ? 'Known bug' : STATUS_META[s].label}</span>`).join('')}</div>` +
      areas
        .map((a) => {
          const r = a.key ? byArea[a.key] : all;
          const automated = (r.passed || 0) + (r.failed || 0) + (r['expected-fail'] || 0) + (r.delayed || 0);
          const segs = SEGS.filter((s) => r[s]).map((s) => {
            const pct = (100 * r[s]) / automated;
            return `<div class="seg" style="flex:${pct} 1 0; background:${STATUS_META[s].color}"
                      data-tip-v="${r[s]} ${STATUS_META[s].label.toLowerCase()}" data-tip-l="${escapeHtml(a.label)}"></div>`;
          });
          return `
          <button class="side-item ${resultsArea === a.key ? 'active' : ''}" data-area="${escapeHtml(a.key)}">
            <div class="side-row">
              <span class="name">${a.key ? `<span class="swatch" style="background:${colorOf(a.key)}"></span>` : ''}${escapeHtml(a.label)}</span>
              <span class="num">${r.passed || 0}/${automated}</span>
            </div>
            <div class="stack">${segs.length ? segs.join('') : '<div class="empty-track"></div>'}</div>
          </button>`;
        })
        .join('');
  }

  function renderLive(data) {
    const live = data.live;
    const running = Boolean(live && live.running);
    // Visible from either tab, so a run in progress is never missed.
    $('tabLive').hidden = !running;

    const strip = $('liveStrip');
    if (!live || (!running && !live.stale)) {
      strip.hidden = true;
      return;
    }
    strip.hidden = false;
    strip.classList.toggle('stale', Boolean(live.stale));
    $('liveBadgeText').textContent = live.stale ? 'Stalled' : 'Live';

    const done = live.completed || 0;
    const planned = live.planned || 0;
    const pct = planned ? Math.min(100, Math.round((100 * done) / planned)) : 0;
    $('liveFill').style.width = pct + '%';
    $('liveMeter').setAttribute('aria-valuemax', String(planned || 0));
    $('liveMeter').setAttribute('aria-valuenow', String(done));
    $('liveProgress').innerHTML = planned
      ? `<b>${done}</b> of <b>${planned}</b> tests done · ${pct}%`
      : `<b>${done}</b> tests done`;

    if (data.startTime) {
      const elapsed = Date.now() - new Date(data.startTime).getTime();
      $('liveElapsed').textContent = (live.stale ? 'Last update ' : 'Running for ') + fmtDuration(Math.max(0, elapsed));
    }
    const cur = live.current;
    if (live.stale) {
      $('liveCurrent').textContent = 'No updates for over 5 minutes — the run may have been interrupted.';
    } else if (cur && cur.title) {
      $('liveCurrent').innerHTML = `Now running: <b>${escapeHtml(cur.title)}</b> <span class="test-file">${escapeHtml(cur.file)}</span>`;
    } else {
      $('liveCurrent').textContent = done ? 'Waiting for the next test…' : 'Run started — waiting for the first test to finish…';
    }
  }

  function renderResults(data) {
    lastResultsData = data;
    renderLive(data);
    if (activeTab !== 'results') return;
    const tests = data.tests || [];
    const running = Boolean(data.live && data.live.running);

    // A new run started: let its rows flash as they arrive.
    if (data.startTime !== lastRunStart) {
      if (lastRunStart !== null) seenResultIds.clear();
      lastRunStart = data.startTime;
    }

    // Rebuild only on change — a 1.5s rebuild would drop focus and hover state.
    const sidebarKey = tests.map((t) => t.file + t.category).join('|') + '|' + resultsArea;
    if (sidebarKey !== lastSidebarKey) {
      lastSidebarKey = sidebarKey;
      renderResultsSidebar(tests);
    }

    const inArea = resultsArea ? tests.filter((t) => areaOfTest(t) === resultsArea) : tests;
    const c = inArea.reduce((acc, t) => { acc[t.category] = (acc[t.category] || 0) + 1; return acc; }, {});
    const passed = c.passed || 0, failed = c.failed || 0, known = c['expected-fail'] || 0;
    // Pass rate covers automated tests only: blocked/skipped are documented
    // permanent gaps, and delayed means the webhook did arrive (just late).
    const automated = passed + failed + known;

    const hero = $('hero');
    if (data.available !== false && automated > 0) {
      const pct = Math.round((100 * passed) / automated);
      $('heroFigure').textContent = pct + '%';
      const fill = $('heroFill');
      fill.style.width = pct + '%';
      fill.style.background = pct === 100 ? 'var(--good)' : pct >= 70 ? 'var(--warning)' : 'var(--critical)';
      $('heroMeter').setAttribute('aria-valuenow', String(pct));
      const scope = resultsArea ? ` in ${escapeHtml(labelOf(resultsArea))}` : '';
      $('heroCaption').innerHTML =
        `<b>${passed} of ${automated}</b> automated webhook tests passing${scope}${running ? ' so far' : ''}` +
        (failed ? ` · <b>${failed}</b> failing` : '') +
        (known ? ` · <b>${known}</b> known CometChat bug${known === 1 ? '' : 's'}` : '');
      const meta = [];
      if (data.duration != null && !running) meta.push('Run took ' + fmtDuration(data.duration));
      if (data.startTime) {
        const startedMs = new Date(data.startTime).getTime();
        meta.push('Started ' + new Date(startedMs).toLocaleString(undefined, { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' }));
        meta.push(fmtAgo(startedMs));
      }
      // Real separator text, not CSS gap alone — otherwise screen readers announce "8m 26sStarted".
      $('heroMeta').textContent = meta.join(' · ');
      hero.hidden = false;
    } else {
      hero.hidden = true;
    }

    const statsKey = JSON.stringify(c) + '|' + inArea.length + '|' + resultsStatus;
    if (statsKey !== lastStatsKey) {
      lastStatsKey = statsKey;
      $('stats').innerHTML =
        `<button class="stat ${resultsStatus === '' ? 'active' : ''}" data-status=""><span class="n">${inArea.length}</span> All</button>` +
        STATUS_ORDER.map((s) => `<button class="stat ${resultsStatus === s ? 'active' : ''}" data-status="${s}">
            <span class="status-dot" style="background:${STATUS_META[s].color}"></span><span class="n">${c[s] || 0}</span> ${STATUS_META[s].label}</button>`).join('');
    }

    const filtered = resultsStatus ? inArea.filter((t) => t.category === resultsStatus) : inArea;
    if (data.available === false) {
      resultsEmptyEl.innerHTML = '<b>No test run found yet.</b><br />Run <code>./run.sh</code> (or <code>npm run test:staging</code>) and results appear here live, test by test.';
      resultsEmptyEl.hidden = false;
    } else if (running && !tests.length) {
      resultsEmptyEl.innerHTML = '<b>Run started.</b><br />Results appear here the moment each test finishes.';
      resultsEmptyEl.hidden = false;
    } else if (!filtered.length) {
      resultsEmptyEl.innerHTML = '<b>No tests in this view.</b>';
      resultsEmptyEl.hidden = false;
    } else {
      resultsEmptyEl.hidden = true;
    }

    const renderKey = filtered.map((t, i) => t.file + t.title + i + t.category).join('|') + '|' + [...openResultIds].join(',');
    if (renderKey === lastResultsRenderKey) return;
    lastResultsRenderKey = renderKey;

    const rank = Object.fromEntries(STATUS_ORDER.map((s, i) => [s, i]));
    reasonById.clear();
    const arrived = new Set();
    for (const t of tests) {
      const id = t.file + '::' + t.title;
      if (resultsSeeded && !seenResultIds.has(id)) arrived.add(id);
      seenResultIds.add(id);
    }
    if (data.available !== false) resultsSeeded = true;
    preserveFocus(resultsListEl, () => { resultsListEl.innerHTML = filtered
      .slice()
      .sort((a, b) => (rank[a.category] ?? 9) - (rank[b.category] ?? 9))
      .map((t) => {
        const id = t.file + '::' + t.title;
        const open = openResultIds.has(id);
        const reason = t.error || t.skipReason || t.knownIssueReason;
        const canExpand = Boolean(reason);
        if (canExpand) reasonById.set(id, reason);
        const meta = STATUS_META[t.category] || { label: t.category, color: 'var(--neutral)' };
        const area = areaOfTest(t);
        // "Not received" can't be diagnosed with certainty without Management
        // API access — it only distinguishes "nothing arrived" from "arrived
        // but wrong". t.notReceivedLabel names the Dashboard tab when known.
        const notReceived = t.likelyNotReceived
          ? `<span class="flag" data-tip-v="No webhook arrived before the timeout" data-tip-l="${escapeHtml(t.notReceivedLabel ? `Check the Dashboard's ${t.notReceivedLabel} trigger` : 'Possibly a disabled Dashboard trigger')}"><span class="status-dot" style="background:var(--accent)"></span>not received?</span>`
          : '';
        const delayed = t.category === 'delayed' && t.delayedArrivalMs != null
          ? `<span class="flag" data-tip-v="Arrived ${escapeHtml(fmtDuration(t.delayedArrivalMs))} after the timeout" data-tip-l="Not necessarily a real failure"><span class="status-dot" style="background:var(--warning)"></span>+${escapeHtml(fmtDuration(t.delayedArrivalMs))} late</span>`
          : '';
        const hint = t.likelyNotReceived && t.notReceivedLabel
          ? `<div class="hint">Check the Dashboard's <b>${escapeHtml(t.notReceivedLabel)}</b> webhook trigger for <b>“${escapeHtml(t.notReceivedTrigger)}”</b> is switched on — no matching event arrived before the timeout. If it's already on, this is likely a real regression.</div>`
          : '';
        return `
        <div class="card ${open ? 'open' : ''} ${arrived.has(id) ? 'card--new' : ''}" data-id="${escapeHtml(id)}">
          <button class="card-head ${canExpand ? '' : 'static'}" type="button" ${canExpand ? `aria-expanded="${open}"` : 'tabindex="-1"'}>
            <span class="cat-bar" style="background:${colorOf(area)}" title="${escapeHtml(labelOf(area))}"></span>
            <span class="chev" aria-hidden="true" style="${canExpand ? '' : 'visibility:hidden'}">▶</span>
            <span class="test-main">
              <span class="flag"><span class="status-dot" style="background:${meta.color}"></span>${escapeHtml(meta.label)}</span>
              ${notReceived}${delayed}
              <span class="test-title">${escapeHtml(t.title)}</span>
              <span class="test-file">${escapeHtml(t.file)}</span>
            </span>
            <span class="when">${escapeHtml(fmtDuration(t.duration))}</span>
          </button>
          ${canExpand ? `<div class="card-body">${hint}
            <pre class="reason ${t.error ? 'error' : 'skip'}">${formatReason(reason)}</pre>
            <div class="card-foot"><button class="btn small" data-copy-reason="${escapeHtml(id)}">Copy</button></div>
          </div>` : ''}
        </div>`;
      })
      .join(''); });
  }

  $('stats').addEventListener('click', (ev) => {
    const b = ev.target.closest('.stat');
    if (!b) return;
    resultsStatus = b.dataset.status;
    lastResultsRenderKey = '';
    lastStatsKey = '';
    renderResults(lastResultsData);
  });

  resultsListEl.addEventListener('click', (ev) => {
    const copy = ev.target.closest('[data-copy-reason]');
    if (copy) {
      navigator.clipboard.writeText(reasonById.get(copy.dataset.copyReason) || '').catch(() => {});
      copy.textContent = 'Copied';
      setTimeout(() => { copy.textContent = 'Copy'; }, 1200);
      return;
    }
    const head = ev.target.closest('.card-head');
    if (!head || head.classList.contains('static')) return;
    const id = head.closest('.card').dataset.id;
    if (openResultIds.has(id)) openResultIds.delete(id); else openResultIds.add(id);
    lastResultsRenderKey = '';
    renderResults(lastResultsData);
  });

  async function pollResults() {
    try {
      const res = await fetch('/test-results');
      const json = await res.json();
      setConnected(true);
      renderResults(json);
    } catch {
      setConnected(false);
    }
  }

  sidebarEl.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.side-item');
    if (!btn) return;
    resultsArea = btn.dataset.area;
    lastResultsRenderKey = '';
    lastSidebarKey = '';
    lastStatsKey = '';
    renderResults(lastResultsData);
  });

  // Relative times drift; refresh just their text.
  setInterval(() => {
    for (const el of detailEl.querySelectorAll('[data-ago]')) el.textContent = fmtAgo(Number(el.dataset.ago));
  }, 5000);
  // The timeline slides with the clock even when nothing new arrives.
  setInterval(() => { if (activeTab === 'events' && !paused) renderTimeline(); }, 1000);

  // One poll at a time: a slow free-tier wake-up must not stack requests.
  let polling = false;
  async function pollOnce() {
    if (polling) return;
    polling = true;
    try { await poll(); } finally { polling = false; }
  }

  renderWindowSeg();
  renderLiveState();
  pollOnce();
  pollResults();
  let tick = 0;
  setInterval(() => {
    tick++;
    pollOnce();
    if (activeTab === 'results' || tick % 2 === 0) pollResults();
  }, 1500);
</script>

</body>
</html>
